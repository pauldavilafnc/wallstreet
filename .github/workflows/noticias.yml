name: Atualizar notícias

on:
  schedule:
    - cron: "15 */3 * * *"   # a cada 3 horas (horário UTC)
  workflow_dispatch:          # permite rodar manualmente

permissions:
  contents: write

jobs:
  noticias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Buscar feeds e gerar noticias.json
        run: python scripts/atualizar_noticias.py
      - name: Salvar se mudou
        run: |
          git config user.name "wallstreet-bot"
          git config user.email "wallstreet-bot@users.noreply.github.com"
          git add noticias.json
          git diff --cached --quiet || (git commit -m "Atualiza notícias" && git push)
