/* ===== lobo 2D (mascote principal): camadas posicionadas em % do palco; animações só com transform ===== */
.wolf{position:relative;width:100%;aspect-ratio:760/1050;overflow:hidden;pointer-events:none;-webkit-user-select:none;user-select:none}
.wolf.bust{aspect-ratio:760/600}.wolf.lkw{width:min(190px,54vw);aspect-ratio:760/640;margin:0 auto 4px}
.wst{position:absolute;left:0;top:0;width:100%;aspect-ratio:760/1050;-webkit-mask-image:linear-gradient(#000 78%,transparent);mask-image:linear-gradient(#000 78%,transparent)}
.wst img{position:absolute;display:block;pointer-events:none}.wbody{object-fit:fill}

.wear.L.fl{animation:wflickl .55s ease-in-out}.wear.R.fl{animation:wflickr .55s ease-in-out}

@keyframes wflickr{0%,100%{transform:none}35%{transform:rotate(3.5deg) translateY(-.4%)}65%{transform:rotate(-1.5deg)}}

#ov:not([hidden]){animation:vfade .2s ease both}#ov:not([hidden]) .sheet{animation:sheetup .3s cubic-bezier(.22,.8,.3,1) both}@keyframes sheetup{from{transform:translateY(26px);opacity:0}to{transform:none;opacity:1}}

/* estilos do mascote (roupas) */
.wolf.sk{container-type:inline-size}.wolf.sk.bust{aspect-ratio:1024/700}.wolf.sk.lkw{aspect-ratio:1024/820}.wolf.sk .wst{aspect-ratio:1024/880}
.sinner{position:absolute;inset:0}

.skgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

@media(prefers-reduced-motion:reduce){.vin,.vin>*,.vin .bar>i,.vin .bar>span,.lk,.rpl i,#ov:not([hidden]),#ov:not([hidden]) .sheet,#nav button.pop svg,.sfx i,.sfx i::after,.wolf[data-sk=bebado] .sinner,.skfade{animation:none!important}.sfx i{opacity:0}.fxh{opacity:.5!important}.wolf.sk .whead{animation:none}.wolf.sk.cl .whead,.wolf.sk.dn .whead{animation:none;transform:rotate(1.4deg) translateY(2%)}.wolf.sk .slid,html.thm *{transition:none!important}}

/* ===== acabamento: entrada em sequência, aba deslizante e micro-animações (só transform e opacidade) ===== */
#lock:not([hidden]){animation:vfade .3s ease both}
.lk>*{animation:lkrise .5s cubic-bezier(.22,.8,.3,1) backwards}
.lk>.wolf{animation:wolfin .7s cubic-bezier(.22,.8,.3,1) .06s backwards;transform-origin:50% 100%}
.lk>:nth-child(2){animation-delay:.12s}.lk>:nth-child(3){animation-delay:.17s}.lk>:nth-child(4){animation-delay:.22s}.lk>:nth-child(5){animation-delay:.27s}.lk>:nth-child(6){animation-delay:.32s}.lk>:nth-child(n+7){animation-delay:.37s}
@keyframes lkrise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes wolfin{from{opacity:0;transform:translateY(18px) scale(.93)}to{opacity:1;transform:none}}
#navind{position:absolute;left:0;top:0;border-radius:10px;background:var(--light);box-shadow:inset 0 0 0 1px var(--edge);z-index:0;pointer-events:none;transition:transform .4s cubic-bezier(.3,1.25,.4,1)}

@keyframes ringin{from{opacity:0;transform:scale(.82) rotate(-35deg)}}
@keyframes rowin{from{opacity:0;transform:translateX(-7px)}}

.tspot::after{content:'';position:absolute;inset:-7px;border-radius:inherit;border:2px solid var(--blue2);animation:tpulse 1.4s ease-out 3}

.tcard[data-p=below]::after{top:-8px;border-right:0;border-bottom:0}.tcard[data-p=above]::after{bottom:-8px;border-left:0;border-top:0}.tcard[data-p=mid]::after{display:none}
.tic{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;margin-bottom:6px;color:var(--blue);background:var(--light)}.tic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tt{margin:0 0 4px;font-size:18px}.tx{margin:0 0 10px;font-size:14.5px;line-height:1.4}
.tskip{position:absolute;top:8px;right:10px;min-height:44px;padding:0 10px;background:none;color:var(--navy);font-weight:700;font-size:14px;text-decoration:underline;text-underline-offset:3px}
.tdots{display:flex;align-items:center;gap:5px;margin-bottom:10px}.tdots i{width:7px;height:7px;border-radius:50%;background:var(--line)}.tdots i.on{width:18px;border-radius:4px;background:var(--btn1);transition:width .25s}.tn{margin-left:auto;font-size:12px;color:var(--navy)}
.tbt{display:flex;gap:8px;justify-content:space-between}.tbt .b1{flex:1}
@media(prefers-reduced-motion:reduce){.tspot,.tdots i{transition:none!important}.tspot::after,.tcard{animation:none!important}}
#tour.tight .tcard{padding:12px 12px 10px}#tour.tight .tic{display:none}#tour.tight .tt{font-size:16px;margin-right:64px}#tour.tight .tx{font-size:13.5px;margin-bottom:6px}#tour.tight .tdots{margin-bottom:6px}

<script>

const brl=c=>HIDE?'R$ •••••':brl0(c);

  s=String(s||'').replace(/[R$\s]/g,'');if(!s)return null;
  if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');else if(/\.\d{3}$/.test(s))s=s.replace(/\./g,'');

 o.items.every(i=>i&&Number.isInteger(i.c)&&i.c>=0&&(i.t==='inc'||i.t==='exp'))&&o.debts.every(d=>d&&Number.isInteger(d.o)&&Array.isArray(d.pays)&&d.pays.every(p=>Number.isInteger(p.c)&&typeof p.d==='string'))&&
 o.boxes.every(b=>b&&Array.isArray(b.moves)&&b.moves.every(p=>Number.isInteger(p.c)&&typeof p.d==='string'))&&o.parc.every(p=>p&&Number.isInteger(p.c)&&/^\d{4}-\d{2}$/.test(p.ym))}
let SECMODE=false,DEK=null,SECOBJ=null,persistQ=Promise.resolve(),FIRST=false,SAVING=false,SNAP=null,WAITERS=[],SAVQ=[],STALE=false,STALEW=0,RAW0=null;try{SECMODE=!!localStorage.getItem('wallstreet.sec');FIRST=!SECMODE&&localStorage.getItem(KEY)===null&&!localStorage.getItem('wallstreet.welcomed')}catch(e){}
let S;
try{if(SECMODE)throw 0;const r=localStorage.getItem(KEY);RAW0=r;S=r?JSON.parse(r):null;
 if(r){ // cópia de segurança dos dados antes de qualquer migração/descarte
  if(S&&(S.v||1)<2&&!localStorage.getItem(KEY+'.pre-v2'))localStorage.setItem(KEY+'.pre-v2',r);
  if(!valid(S)){localStorage.setItem(KEY+'.invalido-'+Date.now(),r);S=null}}}catch(e){S=null}

function migrate(o){ // v2: saldo inicial, notificações, conquistas; parcelas antigas pertencem ao Celular

 delete o.games;ensureOrg(o);ensureCards(o);if(o.pref&&typeof o.pref==='object'&&typeof fixPref==='function')fixPref(o);o.boxes.forEach(b=>{if(!['cofre','moto','carro','casa','viagem','celular','computador','estudos','presente','emergencia','saude','bike'].includes(b.ic))b.ic='cofre'});
 const orphan=o.parc.filter(p=>!p.iid||!o.inst.some(x=>x.id===p.iid));
 if(orphan.length){let t=o.inst.find(x=>x.n==='Celular')||o.inst[0];if(!t){t={id:uid(),n:'Parcelado',c:null,np:null,day:null,paid:false};o.inst.push(t)}orphan.forEach(p=>{p.iid=t.id})}return o}
const fixPref=o=>{if(!o.pref||typeof o.pref!=='object')o.pref={theme:'light',pal:'perola'};if(typeof o.pref.lk!=='number')o.pref.lk=5;if(typeof o.pref.br!=='number')o.pref.br=7;if(typeof o.pref.gl!=='number')o.pref.gl=1;if(!['terno','jazz','piloto','rei','detetive','hacker','mafioso','preso','bebado','ostentacao','praia'].includes(o.pref.ms))o.pref.ms='terno';o.pref.ma=o.pref.ma===1?1:0;if(!Number.isInteger(o.pref.mt))o.pref.mt=-1;if(o.pref.br===14)o.pref.br=15;delete o.pref.vz;const a=o.pref.av;const ci=(v,n)=>{v=Math.floor(+v||0);return v>=0&&v<n?v:0};o.pref.av=(a&&typeof a==='object')?{v:2,m:a.v===2?ci(a.m,10):0,an:(a.an===0||a.an===false)?0:1,set:a.v===2&&a.set?1:0}:{v:2,m:0,an:1,set:0};o.pref.hide=o.pref.hide?1:0;if(o.pref.pal==='rose')o.pref.pal='pink';return o};fixPref(S);migrate(S);

  let d=`M${P[0][0]} ${P[0][1]}`;for(let i=0;i<P.length-1;i++){const a=k(i-1),b=k(i),c=k(i+1),e=k(i+2);d+=`C${(b[0]+(c[0]-a[0])/6).toFixed(1)} ${(b[1]+(c[1]-a[1])/6).toFixed(1)} ${(c[0]-(e[0]-b[0])/6).toFixed(1)} ${(c[1]-(e[1]-b[1])/6).toFixed(1)} ${c[0]} ${c[1]}`}

 return s+'</svg>'}
const noData=m=>`<div class="empty">${m||'Ainda não há dados suficientes. Marque lançamentos como recebidos ou pagos para ver o gráfico.'}</div>`;

 /* --- cálculo (sem eval; arredonda a 10 casas para evitar 0,1+0,2=0,30000000000000004) --- */
 const tokens=s=>{const t=[];let n='';for(const c of s){if(/[0-9,]/.test(c))n+=c;else{if(n){t.push(n);n=''}t.push(c)}}if(n)t.push(n);return t};
 function calc(s){let t=tokens(s);while(t.length&&OPS[t[t.length-1]])t.pop();if(!t.length)return null;
  let i=0,sg=1;if(t[0]==='−'){sg=-1;i=1}
  const num=()=>{const v=t[i++];if(v===undefined||OPS[v]||v==='%')throw 0;const x=parseFloat(v.replace(',','.'));if(!isFinite(x))throw 0;let p=false;if(t[i]==='%'){p=true;i++}return[x,p]};
  let a=num(),cur={sg,val:a[0],pct:a[1]};const terms=[];
  while(i<t.length){const op=t[i++];if(!OPS[op])throw 0;const b=num();
   if(op==='×'||op==='÷'){const l=cur.pct?cur.val/100:cur.val,r=b[1]?b[0]/100:b[0];if(op==='÷'&&r===0)throw 'div';cur.val=op==='×'?l*r:l/r;cur.pct=false}
   else{terms.push(cur);cur={sg:op==='+'?1:-1,val:b[0],pct:b[1]}}}
  terms.push(cur);let tot=0;terms.forEach((m,k)=>{tot+=m.sg*(m.pct?(k===0?m.val/100:tot*m.val/100):m.val)});return Math.round(tot*1e10)/1e10}
 const raw=n=>{const v=Number(n.toPrecision(15));let r=String(v);if(/e/i.test(r))r=v.toFixed(10);return r.replace(/(\.\d*?)0+$/,'$1').replace(/\.$/,'').replace('.',',')};
 const fmt=n=>{const r=raw(n),neg=r[0]==='-',p=(neg?r.slice(1):r).split(',');return(neg?'-':'')+p[0].replace(/\B(?=(\d{3})+(?!\d))/g,'.')+(p[1]?','+p[1]:'')};
 function show(){ce.textContent=err?'':ex.replace(/([+−×÷])/g,' $1 ')||'';let t='0';
  if(err)t='Erro';else if(ex){try{const v=calc(ex);t=v==null?'0':fmt(v)}catch(e){t=''}}cr.textContent=t}
 function press(k){
  if(k==='C'){ex='';err=false;fresh=false}
  else if(k==='⌫'){if(err||fresh){ex='';err=false}else ex=ex.slice(0,-1);fresh=false}
  else if(k==='='){if(!ex)return;try{const v=calc(ex);if(v==null)return;ex=raw(v);fresh=true;err=false}catch(e){err=true;ex='';fresh=false}}
  else{if(err){ex='';err=false}
   if(/[0-9]/.test(k)){if(fresh){ex='';fresh=false}const m=ex.match(/[0-9,]*$/)[0];if(m==='0')ex=ex.slice(0,-1);ex+=k}
   else if(k===','){if(fresh){ex='';fresh=false}const m=ex.match(/[0-9,]*$/)[0];if(m.includes(','))return;ex+=m?',':'0,'}
   else if(k==='%'){if(!/[0-9]$/.test(ex))return;fresh=false;ex+='%'}
   else{fresh=false;if(!ex){if(k==='−')ex='−';return show()}if(ex==='−')return;if(OPS[ex.slice(-1)])ex=ex.slice(0,-1);ex+=k}}
  if(ex.length>40)ex=ex.slice(0,40);show()}

/* ===== SEGURANÇA: usuário + senha, dados criptografados (AES-256-GCM, chave derivada por PBKDF2) =====
   • Os dados ficam cifrados no aparelho com uma chave aleatória (DEK). A DEK fica guardada "embrulhada" duas vezes:
     pela senha e pelo código de recuperação. Trocar a senha não exige recifrar os dados.
   • A chave só existe na memória enquanto o app está aberto; fechar/recarregar = bloqueado.
   • Não há e-mail: o site não tem servidor. A recuperação é pelo código de 20 caracteres, mostrado uma única vez. */
const hasCrypto=!!(window.crypto&&crypto.subtle),enc=new TextEncoder(),dec=new TextDecoder(),SECK='wallstreet.sec',FK='wallstreet.fail',ALF='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',LK=$('#lock');
let SEC0=null,CODE_NEXT=null,hid=0,secBusy=false;try{SEC0=JSON.parse(localStorage.getItem(SECK))}catch(e){}
const nu=u=>String(u||'').trim().toLowerCase().normalize('NFKC'),np=p=>String(p||'').normalize('NFKC');
const b64=u=>{let t='';for(let i=0;i<u.length;i+=8192)t+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(t)},ub64=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0)),rnd=n=>crypto.getRandomValues(new Uint8Array(n));
const newCode=()=>{let t='';for(const x of rnd(20))t+=ALF[x&31];return t.match(/.{4}/g).join('-')},normCode=c=>String(c||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
const kdf=async(sec,salt,it)=>crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:it,hash:'SHA-256'},await crypto.subtle.importKey('raw',enc.encode(sec),'PBKDF2',false,['deriveKey']),{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
const seal=async(k,by)=>{const iv=rnd(12);return{iv:b64(iv),ct:b64(new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},k,by)))}};
const unseal=async(k,o)=>new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub64(o.iv)},k,ub64(o.ct)));
const pwKey=(u,p,salt,it)=>kdf(nu(u)+'\n'+np(p),ub64(salt),it);
async function openRaw(sec,raw){const dek=await crypto.subtle.importKey('raw',raw,'AES-GCM',true,['encrypt','decrypt']);return{raw,dek,data:JSON.parse(dec.decode(await unseal(dek,sec.d)))}}
async function tryPw(sec,u,p){let raw;try{raw=await unseal(await pwKey(u,p,sec.s,sec.it),sec.w)}catch(e){return null}return openRaw(sec,raw)}
async function tryCode(sec,c){let raw;try{raw=await unseal(await kdf(normCode(c),ub64(sec.rs),sec.ri),sec.r)}catch(e){return null}return openRaw(sec,raw)}
async function wrapAll(u,p,raw,newRec,old){const salt=rnd(16),sec={v:1,u:nu(u),it:600000,s:b64(salt),w:await seal(await pwKey(u,p,b64(salt),600000),raw)};let code=null;
 if(newRec||!old){code=newCode();const rs=rnd(16);sec.ri=150000;sec.rs=b64(rs);sec.r=await seal(await kdf(normCode(code),rs,150000),raw)}else{sec.ri=old.ri;sec.rs=old.rs;sec.r=old.r}return{sec,code}}
/* ----- gravação protegida: uma fila só, sempre com o estado mais recente; o "Salvo" só aparece depois de criptografar, gravar e conferir ----- */
function persist(){if(!DEK)return Promise.resolve(false);if(STALE){staleWarn();return Promise.resolve(false)}
 SNAP={js:JSON.stringify(S),k:DEK};const p=new Promise(r=>WAITERS.push(r));if(!SAVING){SAVING=true;persistQ=pump()}return p}
async function pump(){let last=true;
 while(SNAP){const job=SNAP,ws=WAITERS;SNAP=null;WAITERS=[];let ok=false;
  try{const d=await seal(job.k,enc.encode(job.js)),o={...SECOBJ,d},str=JSON.stringify(o);localStorage.setItem(SECK,str);if(localStorage.getItem(SECK)!==str)throw new Error('conferência');SECOBJ=o;ok=true}catch(e){}
  last=ok;ws.forEach(r=>r(ok))}
 SAVING=false;const q=SAVQ;SAVQ=[];toast.now=1;try{if(!last)toast('Não foi possível salvar os dados protegidos. As últimas alterações podem não ter sido gravadas — tente novamente.',5000);else if(q.length)toast(q[q.length-1])}finally{toast.now=0}}

async function openApp(dek,data,sec){if(!valid(data)){viewLogin('Os dados protegidos estão inválidos. Use o código de recuperação ou importe um backup.');return}
 const PRE=JSON.stringify(data);STALE=false;STALEW=0;fixPref(migrate(data));S=data;if(LOCKTHEME){S.pref.theme=LOCKTHEME;LOCKTHEME=null}DEK=dek;SECOBJ=sec;SEC0=sec;achCheck(true);document.body.classList.remove('locked');closeLk();G=null;render();loadNews();if(JSON.stringify(S)!==PRE)save();setTimeout(ntCheck,600);setTimeout(scRun,500);setTimeout(updShow,900)}
async function lockNow(){try{await persistQ}catch(e){}location.reload()}
async function finishSetup(st,u,p){STALE=false;STALEW=0;localStorage.setItem(SECK,JSON.stringify(st.sec));
 const chk=await tryPw(st.sec,u,p);if(!chk||JSON.stringify(chk.data)!==(st.snap||JSON.stringify(S))){localStorage.removeItem(SECK);throw new Error('verificação')}
 SECOBJ=st.sec;SEC0=st.sec;DEK=chk.dek;SECMODE=true;Object.keys(localStorage).filter(k=>k===KEY||k.startsWith(KEY+'.pre-v2')||k.startsWith(KEY+'.invalido-')).forEach(k=>localStorage.removeItem(k));persist();markWelcomed();WEL.on=false}
LK.addEventListener('click',async e=>{const b=e.target.closest('[data-lk]');if(!b)return;const a=b.dataset.lk;
 if(a==='eye'){const i=b.parentElement.querySelector('input');i.type=i.type==='password'?'text':'password';b.classList.toggle('on',i.type==='text');b.setAttribute('aria-pressed',i.type==='text'?'true':'false');wolfState(i.type==='password'?'cl':'dn')}
 else if(a==='theme')lockTheme();else if(a==='rec')viewRecover();else if(a==='back')viewLogin();else if(a==='skip'){try{localStorage.setItem('wallstreet.secskip','1')}catch(x){}if(FIRST||WEL.on){achCheck(true);markWelcomed();WEL.on=false;save();closeLk();render();toast('Tudo pronto!')}else closeLk()}else if(a==='cancel')closeLk();
 else if(a==='new'){WEL.nosec=false;viewName()}else if(a==='nosec'){WEL.nosec=true;S.pref.ms='terno';S.pref.ma=0;viewName()}else if(a==='have')viewHave();else if(a==='back0')viewWelcome();else if(a==='backname')viewName();else if(a==='backmasc')viewMascot();else if(a==='backcolor')viewColor();else if(a==='cpick')colorPick(b.dataset.id);else if(a==='cmode')modePick(b.dataset.id);else if(a==='mpick')mascotPick(b.dataset.id);else if(a==='pickbk'){WEL.pick=true;$('#file').value='';$('#file').click()}
 else if(a==='copy'){try{await navigator.clipboard.writeText($('#skcode').textContent);b.textContent='Copiado ✓'}catch(x){b.textContent='Copie manualmente (toque no código)'}}
 else if(a==='done'&&CODE_NEXT&&!secBusy){secBusy=true;b.disabled=true;b.textContent='Salvando…';try{await CODE_NEXT()}catch(x){$('#skerr').textContent='Não foi possível concluir. Seus dados continuam como estavam. Tente novamente.';b.disabled=false;b.textContent='Concluir'}secBusy=false}});
LK.addEventListener('change',e=>{if(e.target.id==='skok')$('#skdone').disabled=!e.target.checked});
LK.addEventListener('submit',async e=>{e.preventDefault();if(secBusy)return;const id=e.target.id,f=Object.fromEntries(new FormData(e.target)),btn=e.target.querySelector('button:not([type=button])'),err=m=>{const x=$('#le');if(x)x.textContent=m};
 const go=async fn=>{secBusy=true;const t=btn.textContent;btn.disabled=true;btn.textContent='Verificando…';try{await fn()}catch(x){err('Algo deu errado. Tente novamente.');console.error(x)}secBusy=false;if($('#'+id)){btn.disabled=false;btn.textContent=t}};
 if(id==='lf'){if(failWait())return;await go(async()=>{const S0=secNow(),r=await tryPw(S0,f.u,f.p);if(!r){failAdd();viewLogin('Usuário ou senha incorretos.');return}try{localStorage.removeItem(FK)}catch(x){}await openApp(r.dek,r.data,S0)})}
 else if(id==='rf'){if(failWait()){err('Muitas tentativas. Aguarde '+failWait()+'s.');return}const m=pwErr(f.u,f.p,f.c);if(m){err(m);return}
  await go(async()=>{const S0=secNow(),r=await tryCode(S0,f.k);if(!r){failAdd();err('Código de recuperação inválido.');return}try{localStorage.removeItem(FK)}catch(x){}
   const {sec,code}=await wrapAll(f.u,f.p,r.raw,true);sec.d=S0.d;viewCode(code,async()=>{localStorage.setItem(SECK,JSON.stringify(sec));await openApp(r.dek,r.data,sec);toast('Senha redefinida ✓')},'Novo código de recuperação')})}
 else if(id==='nf'){const nm=String(f.n||'').trim().replace(/\s+/g,' ');if(!nm){err('Digite seu nome.');return}if(nm.length>30){err('Use no máximo 30 caracteres.');return}WEL.name=nm;S.owner=nm;G=null;if(WEL.nosec||!hasCrypto)finishNoSec();else viewMascot()}
 else if(id==='mf'){viewColor()}
 else if(id==='cf'){viewSetup(false,'welcome')}
 else if(id==='bf'){const o=WEL.bk;await go(async()=>{let d;try{d=JSON.parse(dec.decode(await unseal(await kdf(np(f.p),ub64(o.s),o.it),{iv:o.iv,ct:o.ct})))}catch(x){viewBkPw(o,'Senha incorreta ou arquivo corrompido.');return}welApply(d)})}
 else if(id==='sf'){const m=pwErr(f.u,f.p,f.c);if(m){err(m);return}
  await go(async()=>{const dek=await crypto.subtle.generateKey({name:'AES-GCM',length:256},true,['encrypt','decrypt']),raw=new Uint8Array(await crypto.subtle.exportKey('raw',dek)),{sec,code}=await wrapAll(f.u,f.p,raw,true);const snap=JSON.stringify(S);sec.d=await seal(dek,enc.encode(snap));
   viewCode(code,async()=>{await finishSetup({sec,snap},f.u,f.p);closeLk();render();toast(WEL.ctx==='welcome'?'Conta criada! Tudo pronto ✓':'Proteção ativada ✓');{const nw=WEL.ctx==='welcome';WEL.ctx='';if(nw)tourSoon()}},'Seu código de recuperação')})}});
/* ----- Ajustes → Segurança ----- */
function secCard(){if(!hasCrypto)return'<div class="card"><h3>Segurança</h3><p class="lbl">Este navegador/endereço não permite criptografia (precisa de conexão segura, https).</p></div>';
 if(!SECMODE)return`<div class="card"><h3>Segurança</h3><p class="lbl" style="margin-bottom:8px">Proteção por usuário e senha <b>desativada</b>. Qualquer pessoa com acesso a este navegador vê seus dados.</p><button class="b1 full" data-act="secon">Ativar proteção</button></div>`;
 const lk=S.pref.lk;return`<div class="card"><h3>Segurança <span class="tag ok">Protegido</span></h3><p class="lbl" style="margin-bottom:8px">Dados criptografados neste aparelho (AES-256). Usuário: <b>${esc(SECOBJ.u)}</b>. O backup comum <b>não</b> é criptografado; use "Exportar backup criptografado" em Backup.</p>
 <label>Bloquear automaticamente<select id="lkSel">${[[1,'Após 1 minuto fora do app'],[5,'Após 5 minutos fora do app'],[15,'Após 15 minutos fora do app'],[-1,'Só ao fechar o app']].map(([v,t])=>`<option value="${v}"${lk===v?' selected':''}>${t}</option>`).join('')}</select></label>
 <div class="acts"><button class="b1" data-act="seclock">Bloquear agora</button><button class="b2" data-act="secchg">Alterar senha</button><button class="b2" data-act="secnew">Novo código</button><button class="b2" data-act="secoff">Remover</button></div></div>`}
document.addEventListener('change',e=>{if(e.target.id==='lkSel'){S.pref.lk=+e.target.value;commit('Bloqueio automático alterado')}});
const needPw=async cur=>{const r=await tryPw(SECOBJ,SECOBJ.u,cur);return r};
function chgForm(){form('Alterar usuário/senha',[{k:'cur',l:'Senha atual',t:'pw',ac:'current-password'},{k:'u',l:'Usuário',v:SECOBJ.u,ac:'username'},{k:'p',l:'Nova senha (mínimo 8)',t:'pw',ac:'new-password'},{k:'c',l:'Repita a nova senha',t:'pw',ac:'new-password'}],async v=>{
 if(secBusy)return'Aguarde…';const m=pwErr(v.u,v.p,v.c);if(m)return m;secBusy=true;try{if(failWait())return'Muitas tentativas. Aguarde '+failWait()+'s.';if(!await needPw(v.cur)){failAdd();return'Senha atual incorreta.'}
  await persistQ;const raw=new Uint8Array(await crypto.subtle.exportKey('raw',DEK)),{sec}=await wrapAll(v.u,v.p,raw,false,SECOBJ);sec.d=SECOBJ.d;SECOBJ=sec;SEC0=sec;localStorage.setItem(SECK,JSON.stringify(sec));try{localStorage.removeItem(FK)}catch(x){}toast('Senha alterada ✓');render()}finally{secBusy=false}})}
function newCodeForm(){form('Gerar novo código de recuperação',[{k:'cur',l:'Senha atual',t:'pw',ac:'current-password'}],async v=>{
 if(secBusy)return'Aguarde…';secBusy=true;try{if(failWait())return'Muitas tentativas. Aguarde '+failWait()+'s.';if(!await needPw(v.cur)){failAdd();return'Senha atual incorreta.'}
  await persistQ;const raw=new Uint8Array(await crypto.subtle.exportKey('raw',DEK)),code=newCode(),rs=rnd(16),r=await seal(await kdf(normCode(code),rs,150000),raw);
  setTimeout(()=>viewCode(code,async()=>{await persistQ;SECOBJ={...SECOBJ,ri:150000,rs:b64(rs),r};SEC0=SECOBJ;localStorage.setItem(SECK,JSON.stringify(SECOBJ));closeLk();toast('Novo código ativado — o anterior deixou de valer')},'Novo código de recuperação'),50)}finally{secBusy=false}})}
function offForm(){form('Remover proteção',[{k:'cur',l:'Senha atual',t:'pw',ac:'current-password'}],async v=>{
 if(secBusy)return'Aguarde…';secBusy=true;try{if(failWait())return'Muitas tentativas. Aguarde '+failWait()+'s.';if(!await needPw(v.cur)){failAdd();return'Senha atual incorreta.'}
  await persistQ;localStorage.setItem(KEY,JSON.stringify(S));localStorage.removeItem(SECK);SECMODE=false;DEK=null;SECOBJ=null;SEC0=null;toast('Proteção removida — dados voltaram a ficar sem senha');render()}finally{secBusy=false}})}
/* ===== BACKUP CRIPTOGRAFADO: arquivo .json cifrado com uma senha própria (AES-256-GCM, chave derivada por PBKDF2 de 600.000 voltas) ===== */
async function saveText(fn,txt){try{const dl=window.claude&&await window.claude.use('downloads');if(dl){await dl.save({filename:fn,data:txt});return true}
 const u=URL.createObjectURL(new Blob([txt],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download=fn;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);return true}catch(e){if(e&&e.code==='declined')return false;throw e}}
function expEncForm(){form('Exportar backup criptografado',[{k:'p',l:'Senha do backup (mínimo 8 caracteres)',t:'pw',ac:'new-password'},{k:'c',l:'Repita a senha do backup',t:'pw',ac:'new-password'}],async v=>{
 if(secBusy)return'Aguarde…';if(np(v.p).length<8)return'A senha precisa ter pelo menos 8 caracteres.';if(v.p!==v.c)return'As senhas não conferem.';
 secBusy=true;try{const salt=rnd(16),it=600000,sl=await seal(await kdf(np(v.p),salt,it),enc.encode(JSON.stringify(S)));
  const out=JSON.stringify({app:'wallstreet-backup',enc:true,v:1,at:todayStr(),it,s:b64(salt),iv:sl.iv,ct:sl.ct},null,1);
  if(await saveText('wallstreet-backup-criptografado-'+todayStr()+'.json',out))setTimeout(()=>{toast('Backup criptografado exportado');flagBkp()},60)}catch(e){return'Não foi possível exportar.'}finally{secBusy=false}})}
function importObj(o){if(!valid(o)||typeof o.owner!=='string')return toast('Arquivo inválido: não é um backup do WALL STREET');
 ask('Substituir os dados atuais pelo backup selecionado?',()=>{migrate(o);if(!o.pref||typeof o.pref!=='object')o.pref=S.pref;o.flags=(o.flags&&typeof o.flags==='object')?o.flags:{};o.flags.bkpAt=todayStr();S=o;open={};commit('Backup importado ✓')})}
function importEnc(o){if(!hasCrypto)return toast('Este navegador não consegue abrir backups criptografados (precisa de https).');
 if(!(Number.isInteger(o.it)&&o.it>=100000&&o.it<=2000000)||typeof o.s!=='string'||typeof o.iv!=='string'||typeof o.ct!=='string')return toast('Arquivo inválido: backup criptografado danificado');
 form('Backup criptografado',[{k:'p',l:'Senha do backup',t:'pw',ac:'current-password'}],async v=>{if(secBusy)return'Aguarde…';secBusy=true;let d;
  try{d=JSON.parse(dec.decode(await unseal(await kdf(np(v.p),ub64(o.s),o.it),{iv:o.iv,ct:o.ct})))}catch(e){return'Senha incorreta ou arquivo corrompido.'}finally{secBusy=false}
  setTimeout(()=>importObj(d),60)})}
/* ----- bloqueio automático ao ficar fora do app ----- */
document.addEventListener('visibilitychange',()=>{if(!SECMODE||!DEK)return;if(document.hidden)hid=Date.now();else if(hid&&S.pref.lk>=0&&Date.now()-hid>=S.pref.lk*60000)lockNow()});
/* ----- inicialização da segurança ----- */
if(SECMODE){document.body.classList.add('locked');if(!SEC0||!hasCrypto)lockUI('<div class="card"><h3>Dados protegidos</h3><p class="lbl">Não foi possível abrir: '+(hasCrypto?'o registro de segurança está ilegível.':'este endereço não permite criptografia (precisa de https).')+' Nada foi apagado.</p></div>');else viewLogin()}
else if(FIRST)viewWelcome();
else if(hasCrypto&&!localStorage.getItem('wallstreet.secskip'))viewSetup(false);


/* Ajustes → Aparência → Efeito de vidro */
document.addEventListener('change',e=>{if(e.target.id==='glSel'){S.pref.gl=+e.target.value;commit('Efeito de vidro atualizado')}else if(e.target.id==='anSel'){S.pref.av.an=+e.target.value;commit('Animações atualizadas')}});

if(!SECMODE){achCheck(true);save()}
render();loadNews();
if('serviceWorker' in navigator&&newsHosted())navigator.serviceWorker.register('sw.js').catch(()=>{}); /* instalável e funciona offline quando hospedado */
if(RM.addEventListener)RM.addEventListener('change',render);
</script>
