<script>
/* ===== WALL STREET — Seu dinheiro, sob controle. =====
   Valores internos em CENTAVOS inteiros. Dados em localStorage. */
'use strict';
const KEY='wallstreet.v1',BUILD='3.0 · com voz da assistente · 06/11/2026';
const CATS={exp:['Alimentação','Transporte','Compras','Roupas','Lazer','Trabalho','Casa','Saúde','Educação','Financeiro','Tecnologia','Cuidados pessoais','Presentes','Outros'],inc:['Salário','Comissão','Freelancer','Outro']};
const PAYS=['Pix','Cartão de débito','Cartão de crédito','Dinheiro/Espécie','Outro'];
const MN=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const pad=n=>String(n).padStart(2,'0');
const brl=c=>{const n=Math.abs(Math.round(c));return (c<0?'-':'')+'R$ '+String(Math.floor(n/100)).replace(/\B(?=(\d{3})+(?!\d))/g,'.')+','+pad(n%100)};
const fin=c=>c==null?'':(c/100).toFixed(2).replace('.',',');
function parseMoney(s){ // "1.234,56" -> 123456 ; vazio/invalid -> null
  s=String(s||'').replace(/[R$\s]/g,'');if(!s)return null;
  if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');else if(/\.\d{3}$/.test(s))s=s.replace(/\./g,'');
  const n=Number(s);return isFinite(n)&&n>=0?Math.round(n*100):NaN}
const ymOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1);
const todayStr=()=>{const d=new Date();return ymOf(d)+'-'+pad(d.getDate())};
const shift=(ym,k)=>{const [y,m]=ym.split('-').map(Number);return ymOf(new Date(y,m-1+k,1))};
const mlabel=ym=>{const [y,m]=ym.split('-');return MN[m-1]+' de '+y};
const dmy=d=>d.split('-').reverse().join('/');

/* ----- dados iniciais ----- */
function seed(){return{v:2,owner:"Paul",opening:null,limits:{},ntf:{read:{}},pref:{theme:'light',pal:'blue',av:{e:0,m:0,bg:0,an:1}},items:[],inst:[],parc:[],debts:[],boxes:[]}}

function valid(o){return o&&typeof o==='object'&&(o.limits==null||(typeof o.limits==='object'&&Object.values(o.limits).every(v=>Number.isInteger(v)&&v>0)))&&(o.opening==null||(typeof o.opening==='object'&&Number.isInteger(o.opening.c)&&o.opening.c>=0))&&['items','inst','parc','debts','boxes'].every(k=>Array.isArray(o[k]))&&
 o.items.every(i=>i&&Number.isInteger(i.c)&&i.c>=0&&(i.t==='inc'||i.t==='exp'))&&o.debts.every(d=>d&&Number.isInteger(d.o)&&Array.isArray(d.pays)&&d.pays.every(p=>Number.isInteger(p.c)&&typeof p.d==='string'))&&
 o.boxes.every(b=>b&&Array.isArray(b.moves)&&b.moves.every(p=>Number.isInteger(p.c)&&typeof p.d==='string'))&&o.parc.every(p=>p&&Number.isInteger(p.c)&&/^\d{4}-\d{2}$/.test(p.ym))}
let SECMODE=false,DEK=null,SECOBJ=null,persistQ=Promise.resolve(),FIRST=false;try{SECMODE=!!localStorage.getItem('wallstreet.sec');FIRST=!SECMODE&&localStorage.getItem(KEY)===null&&!localStorage.getItem('wallstreet.welcomed')}catch(e){}
let S;
try{if(SECMODE)throw 0;const r=localStorage.getItem(KEY);S=r?JSON.parse(r):null;
 if(r){ // cópia de segurança dos dados antes de qualquer migração/descarte
  if(S&&(S.v||1)<2&&!localStorage.getItem(KEY+'.pre-v2'))localStorage.setItem(KEY+'.pre-v2',r);
  if(!valid(S)){localStorage.setItem(KEY+'.invalido-'+Date.now(),r);S=null}}}catch(e){S=null}
if(!S){S=seed();}
function migrate(o){ // v2: saldo inicial, notificações, conquistas; parcelas antigas pertencem ao Celular
 if(o.ach===undefined)o.ach=null;if(!o.limits||typeof o.limits!=='object')o.limits={};if(!o.flags||typeof o.flags!=='object')o.flags={};
 if(o.opening===undefined)o.opening=null;if(!o.ntf||typeof o.ntf!=='object'||!o.ntf.read)o.ntf={read:{}};if(!o.ntf.since){const d=new Date();o.ntf.since=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}o.v=2;
 const orphan=o.parc.filter(p=>!p.iid||!o.inst.some(x=>x.id===p.iid));
 if(orphan.length){let t=o.inst.find(x=>x.n==='Celular')||o.inst[0];if(!t){t={id:uid(),n:'Parcelado',c:null,np:null,day:null,paid:false};o.inst.push(t)}orphan.forEach(p=>{p.iid=t.id})}return o}
const fixPref=o=>{if(!o.pref||typeof o.pref!=='object')o.pref={theme:'light',pal:'blue'};if(typeof o.pref.lk!=='number')o.pref.lk=5;if(typeof o.pref.br!=='number')o.pref.br=7;if(o.pref.br===14)o.pref.br=15;const a=o.pref.av;o.pref.av=(a&&typeof a==='object')?{e:+a.e||0,m:+a.m||0,bg:+a.bg||0,an:(a.an===0||a.an===false)?0:1}:{e:0,m:0,bg:0,an:1};return o};fixPref(S);migrate(S);
function lookPref(){try{const l=JSON.parse(localStorage.getItem('wallstreet.look'));if(l&&l.t)return{theme:l.t,pal:l.p}}catch(e){}return{theme:'light',pal:'blue'}}
function applyPref(){const p=(SECMODE&&!DEK)?lookPref():S.pref,r=document.documentElement;r.dataset.theme=p.theme==='dark'?'dark':'light';r.dataset.pal=['blue','violet','teal'].includes(p.pal)?p.pal:'blue';const m=document.querySelector('meta[name=theme-color]');if(m)m.content=p.theme==='dark'?'#0B1220':'#0B1730';try{localStorage.setItem('wallstreet.look',JSON.stringify({t:r.dataset.theme,p:r.dataset.pal}))}catch(e){}}
let view='home',vm=ymOf(new Date()),ry=new Date().getFullYear(),rm='',pend=null,open={};
function save(){if(FIRST)return true;if(SECMODE){if(!DEK)return false;persist();return true}try{localStorage.setItem(KEY,JSON.stringify(S));return true}catch(e){toast('Não foi possível salvar (armazenamento cheio ou bloqueado)');return false}}
save();
function toast(m){const t=$('#toast');t.textContent=m;t.className='s';clearTimeout(toast.h);toast.h=setTimeout(()=>t.className='',1800)}
function commit(msg){const nw=achCheck();if(save())toast(msg||'Salvo ✓');render();if(nw.length)celebrate(nw)}

/* ----- cálculos ----- */
const rowsOf=(t,m)=>S.items.filter(i=>i.t===t&&(i.fixed?m>=i.from:i.ym===m)).sort((a,b)=>a.day-b.day);
function due(i,m){const [y,mo]=m.split('-').map(Number);return new Date(y,mo-1,Math.min(i.day,new Date(y,mo,0).getDate()),23,59,59)}
const stat=(i,m)=>i.done&&i.done[m]!=null?'ok':(due(i,m)<new Date()?'late':'pend');
const slabel=(i,s)=>s==='ok'?(i.t==='inc'?'Recebido':'Pago'):s==='late'?'Atrasado':'Pendente';
const sum=(a,f)=>a.reduce((x,y)=>x+f(y),0);
const paidOf=d=>sum(d.pays,p=>p.c),balOf=d=>d.o-paidOf(d);
const savedOf=b=>sum(b.moves,p=>p.c);
function flows(){const m={},g=k=>m[k]||(m[k]={inc:0,exp:0,dp:0,bx:0});
 S.items.forEach(i=>Object.entries(i.done||{}).forEach(([k,c])=>{g(k)[i.t]+=c}));
 S.debts.forEach(d=>d.pays.forEach(p=>{g(p.d.slice(0,7)).dp+=p.c}));
 S.boxes.forEach(b=>b.moves.forEach(p=>{g(p.d.slice(0,7)).bx+=p.c}));return m}
const net=x=>x.inc-x.exp-x.dp-x.bx;
const balance=()=>Object.values(flows()).reduce((a,x)=>a+net(x),0)+(S.opening?S.opening.c:0);

/* ----- gráficos SVG (sem bibliotecas, funcionam offline) ----- */
function chart(labels,series,colors,o={}){
 const W=340,H=o.h||150,pt=14,pb=18,all=series.flat(),hi=Math.max(0,...all),lo=Math.min(0,...all),rg=(hi-lo)||1;
 const y=v=>pt+(hi-v)/rg*(H-pt-pb),n=labels.length,gw=W/n,bw=gw*.7/series.length;let s=`<svg viewBox="0 0 ${W} ${H}" role="img">`;
 s+=`<line x1="0" x2="${W}" y1="${y(0)}" y2="${y(0)}" style="stroke:var(--line)"/>`;
 if(o.line){const pts=series[0].map((v,i)=>`${(i+.5)*gw},${y(v)}`).join(' ');s+=`<polyline points="${pts}" fill="none" style="stroke:${colors[0]}" stroke-width="2.5"/>`+series[0].map((v,i)=>`<circle cx="${(i+.5)*gw}" cy="${y(v)}" r="3" style="fill:${colors[0]}"/>`).join('')}
 else series.forEach((sr,k)=>sr.forEach((v,i)=>{const x=i*gw+gw*.15+k*bw,y1=y(Math.max(v,0)),y2=y(Math.min(v,0));
  s+=`<rect x="${x}" y="${y1}" width="${bw}" height="${Math.max(2,y2-y1)}" rx="3" style="fill:${o.cc?o.cc[i]:colors[k]}"/>`;
  if(o.val)s+=`<text x="${x+bw/2}" y="${y1-4}" font-size="10" text-anchor="middle" style="fill:var(--navy)">${brl(v)}</text>`}));
 labels.forEach((l,i)=>{s+=`<text x="${(i+.5)*gw}" y="${H-4}" font-size="10" text-anchor="middle" style="fill:var(--gray)">${l}</text>`});
 return s+'</svg>'}
const noData=m=>`<div class="empty">${m||'Ainda não há dados suficientes. Marque lançamentos como recebidos ou pagos para ver o gráfico.'}</div>`;

/* ----- telas ----- */
const bar=(p,c='')=>`<div class="bar ${c}"><i style="width:${Math.max(0,Math.min(100,p))}%"></i></div>`;
function itemRow(i,m,btns=true){const s=stat(i,m);
 return `<div class="row"><div class="t"><b>${esc(i.d)}</b><span class="lbl">${i.t==='exp'?(i.fixed?'Vence dia '+pad(i.day):'Data '+dmy((i.dt&&i.dt.startsWith(m+'-')?i.dt:m+'-'+pad(Math.min(i.day,dimOf(m)))))):'Dia '+pad(i.day)}${i.cat?' · '+esc(i.cat):''}${i.pay?' · '+esc(i.pay):''}${i.fixed?' · mensal':''}${s==='ok'&&i.paidOn&&i.paidOn[m]?' · '+(i.t==='inc'?'recebido':'pago')+' em '+dmy(i.paidOn[m]):''}</span></div>
 <div class="a"><span class="${i.t==='inc'?'pos':'neg'}">${brl(i.c)}</span><br><span class="tag ${s}">${slabel(i,s)}</span></div>
 ${btns?`<button class="ib" data-act="tog" data-id="${i.id}" data-m="${m}" aria-label="Marcar">${s==='ok'?'↺':'✓'}</button>`:''}</div>`}

function ring(p,c){const r=22,L=2*Math.PI*r,d=Math.max(0,Math.min(100,p))/100*L;
 return `<svg viewBox="0 0 56 56" style="width:56px;height:56px;flex:none"><circle cx="28" cy="28" r="${r}" fill="none" style="stroke:var(--light)" stroke-width="6"/><circle cx="28" cy="28" r="${r}" fill="none" style="stroke:${c||'var(--blue)'}" stroke-width="6" stroke-linecap="round" stroke-dasharray="${d} ${L}" transform="rotate(-90 28 28)"/><text x="28" y="32" font-size="12" font-weight="700" text-anchor="middle" style="fill:var(--navy)">${Math.round(p)}%</text></svg>`}
/* ----- avatar: SVG leve, sem imagens ----- */
const BGS=[['#3B82F6','#0B1730'],['#DBEAFE','#0B1730'],['#2563EB','#fff'],['#0B1730','#fff'],['#FACC15','#0B1730'],['#34D399','#0B1730'],['#FB923C','#0B1730'],['#F472B6','#0B1730'],['#A78BFA','#0B1730']];
const EYES=[
 '<circle cx="35" cy="42" r="5.5"/><circle cx="65" cy="42" r="5.5"/>',
 '<path d="M27 46Q35 34 43 46M57 46Q65 34 73 46" fill="none" stroke-width="4.5" stroke-linecap="round"/>',
 '<circle cx="35" cy="42" r="5.5"/><path d="M57 41Q65 49 73 41" fill="none" stroke-width="4.5" stroke-linecap="round"/>',
 '<circle cx="35" cy="42" r="9" fill="#fff" stroke-width="3"/><circle cx="35" cy="42" r="3.6"/><circle cx="65" cy="42" r="9" fill="#fff" stroke-width="3"/><circle cx="65" cy="42" r="3.6"/>',
 '<path d="M26 43h18M56 43h18" stroke-width="4.5" stroke-linecap="round"/>',
 '<text x="35" y="50" font-size="22" font-weight="800" text-anchor="middle" fill="currentColor" stroke="none">$</text><text x="65" y="50" font-size="22" font-weight="800" text-anchor="middle" fill="currentColor" stroke="none">$</text>',
 '<circle cx="34" cy="42" r="11" fill="none" stroke-width="3.5"/><circle cx="66" cy="42" r="11" fill="none" stroke-width="3.5"/><path d="M45 42h10" stroke-width="3.5"/><circle cx="34" cy="42" r="3.4"/><circle cx="66" cy="42" r="3.4"/>'];
const MOUTHS=[
 '<path d="M32 62Q50 80 68 62" fill="none" stroke-width="4.5" stroke-linecap="round"/>',
 '<path d="M37 69H63" fill="none" stroke-width="4.5" stroke-linecap="round"/>',
 '<path d="M30 60Q50 92 70 60Z" stroke-linejoin="round" stroke-width="3"/>',
 '<path d="M32 62Q50 78 68 62" fill="none" stroke-width="4.5" stroke-linecap="round"/><path d="M50 70q0 12 8 12t8-10z" fill="#F87171" stroke="none"/>',
 '<ellipse cx="50" cy="69" rx="6.5" ry="8.5" stroke="none"/>',
 '<path d="M36 69Q54 76 66 60" fill="none" stroke-width="4.5" stroke-linecap="round"/>',

const PRESETS=[[0,0],[0,1],[2,0],[2,3],[1,2],[3,4],[4,0],[5,2],[6,5],[0,5]];
const avSvg=(a,sz,an)=>{const b=BGS[a.bg%BGS.length],e=a.e%EYES.length,m=a.m%MOUTHS.length;
 return `<svg class="avs${an?' an':''}" viewBox="0 0 100 100" width="${sz}" height="${sz}" style="color:${b[1]}" aria-hidden="true"><circle cx="50" cy="50" r="50" fill="${b[0]}"/><g class="eyes" fill="currentColor" stroke="currentColor">${EYES[e]}</g><g class="mouth" fill="currentColor" stroke="currentColor">${MOUTHS[m]}</g></svg>`};
const RM=window.matchMedia?matchMedia('(prefers-reduced-motion: reduce)'):{matches:false};
const animOn=()=>!!S.pref.av.an&&!RM.matches;
function avSheet(){const a=S.pref.av,o=$('#ov');
 o.innerHTML=`<div class="sheet"><h3>Personalizar avatar</h3><div class="avp">${avSvg(a,96,animOn())}</div>
 <div class="lab">Sugestões</div><div class="avg">${PRESETS.map(([e,m],i)=>`<button data-act="avp" data-id="${i}" class="${a.e===e&&a.m===m?'on':''}" aria-label="Rosto ${i+1}">${avSvg({e,m,bg:a.bg},44)}</button>`).join('')}</div>

   • Os dados ficam cifrados no aparelho com uma chave aleatória (DEK). A DEK fica guardada "embrulhada" duas vezes:
     pela senha e pelo código de recuperação. Trocar a senha não exige recifrar os dados.
   • A chave só existe na memória enquanto o app está aberto; fechar/recarregar = bloqueado.

 for(let k=0;k<items.length;k++){const it=items[k];if(tok!==VZ.tok||(!force&&!vzp().on))return;let done=false;
  if(it.id&&VZ.have.has(it.id)){try{await vzClip(it.id);done=true}catch(e){if(e&&e.name==='NotAllowedError'){VZ.pending=items.slice(k);vlog(['blocked',it.id]);return}vlog(['err',String(e&&e.name)])}}
  if(!done&&vzp().fb&&it.text)done=await vzTTS(it.text);
  if(done&&mark&&first){first=false;try{localStorage.setItem('wallstreet.vzlast',String(Date.now()))}catch(e){}}
  await new Promise(r=>setTimeout(r,it.gap||250))}}
function vzStop(){VZ.tok++;try{if(VZ.cur)VZ.cur.pause()}catch(e){}try{window.speechSynthesis&&speechSynthesis.cancel()}catch(e){}}
function vzItems(){const nm=S.owner.trim().split(' ')[0]||'Paul',paul=nm.toLowerCase()==='paul',tpl=G&&G.tpl;let last='';try{last=localStorage.getItem('wallstreet.vzentry')||''}catch(e){}
 const E=[['e1','Oi, '+nm+'!'],['e2','Olá! Bem-vindo de volta.'],['e3','Que bom te ver por aqui!']],ok=E.filter(e=>VZ.have.has(e[0])&&(e[0]!=='e1'||paul)),pool=(ok.length?ok:E).filter(e=>e[0]!==last),pick=(pool.length?pool:(ok.length?ok:E))[Math.floor(Math.random()*(pool.length?pool:(ok.length?ok:E)).length)];
 try{localStorage.setItem('wallstreet.vzentry',pick[0])}catch(e){}
 const gid=tpl&&VZ_TPL[tpl],gOk=gid&&(!tpl.includes('{n}')||paul);
 return[{id:(pick[0]==='e1'&&!paul)?null:pick[0],text:pick[1]},{id:gOk?gid:null,text:(G?G.text:'').replace(EMO,'').trim()}]}
async function vzOpen(){try{await VZ.ready}catch(e){}const v=vzp();if(!v.on||!v.open||document.hidden)return;let last=0;try{last=+localStorage.getItem('wallstreet.vzlast')||0}catch(e){}
 if(Date.now()-last<30*60000){vlog(['cool']);return}const it=vzItems();if(!it.some(i=>(i.id&&VZ.have.has(i.id))||(v.fb&&i.text))){vlog(['mute']);return}vzSay(it,true)}
function vzMq(){const v=vzp();if(!v.on||!v.mq)return;const el=$('#s-home .bub p');if(!el)return;const t=el.textContent.trim();vzSay([{id:VZ_FIX[t]||null,text:t}])}
document.addEventListener('pointerdown',()=>{if(VZ.pending){const p=VZ.pending;VZ.pending=null;vzSay(p,true)}},true);
document.addEventListener('visibilitychange',()=>{if(document.hidden)vzStop()});
const vzCheck=f=>(!/^audio\//.test(f.type)&&!/\.(mp3|wav|m4a|ogg|aac|opus|webm)$/i.test(f.name))?'Esse arquivo não parece ser um áudio.':f.size>3e6?'Áudio grande demais (máximo 3 MB).':f.size<500?'Áudio vazio ou corrompido.':'';
$('#vfile').addEventListener('change',async e=>{const f=e.target.files[0],id=VZ.target;VZ.target=null;if(!f||!id)return;const m=vzCheck(f);if(m)return toast(m);
 try{await vput(id,{blob:f,name:f.name,size:f.size,at:Date.now()});VZ.have.add(id);VZ.meta[id]={name:f.name,size:f.size};toast('Gravação salva ✓');render()}catch(x){toast('Não foi possível salvar o áudio')}});
$('#vfileb').addEventListener('change',e=>{const all=[...e.target.files].sort((a,b)=>(a.lastModified-b.lastModified)||a.name.localeCompare(b.name)),ok=all.filter(f=>!vzCheck(f)),bad=all.length-ok.length;
 let ids=VZ_CORE.filter(id=>!VZ.have.has(id));if(!ids.length)ids=VZ_CORE.slice();const n=Math.min(ok.length,ids.length);if(!n)return toast(bad?'Nenhum arquivo de áudio válido.':'Nenhum arquivo escolhido.');
 ask(`Ligar ${n} áudio(s) às frases em ordem (do mais antigo ao mais novo), a partir de "${(VZP.find(p=>p[0]===ids[0])||[])[2]}"?${bad?' ('+bad+' arquivo(s) inválido(s) ignorado(s).)':''}${ok.length>n?' (Sobraram '+(ok.length-n)+' arquivo(s).)':''} Depois toque em Ouvir para conferir.`,async()=>{
  try{for(let k=0;k<n;k++){const f=ok[k];await vput(ids[k],{blob:f,name:f.name,size:f.size,at:Date.now()});VZ.have.add(ids[k]);VZ.meta[ids[k]]={name:f.name,size:f.size}}render();toast(n+' gravações salvas ✓')}catch(x){toast('Não foi possível salvar os áudios')}})});

 return `<div class="card"><h3>Voz da assistente <span class="tag ${v.on&&n?'ok':''}">${v.on?(n?'Ligada':'Ligada · sem gravações'):'Desligada'}</span></h3>

 const row=p=>{const h=VZ.have.has(p[0]),m=VZ.meta[p[0]]||{};return `<div class="vzr"><b>${esc(p[2])}</b><div class="lbl">${h?'✓ Gravada · '+esc(m.name||'')+' · '+Math.max(1,Math.round((m.size||0)/1024))+' KB':'Sem gravação'}</div><div class="acts"><button class="b2" data-act="vzpick" data-id="${p[0]}">${h?'Trocar':'Escolher áudio'}</button>${h?`<button class="b1" data-act="vzplay" data-id="${p[0]}">Ouvir</button><button class="b2" data-act="vzdel" data-id="${p[0]}">Remover</button>`:''}</div></div>`};

 ${gr.map(g=>`<div class="sec">${g}</div><div class="card">${VZP.filter(p=>p[1]===g).map(row).join('')}</div>`).join('')}
 <p class="lbl" style="margin:6px 2px">As gravações dizem “Paul”. Se você mudar o nome em Ajustes, as frases com o nome deixam de tocar (ou use a voz do celular).</p>`}
