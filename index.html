  if(performance.now()-CCPAYT<900)return'Pagamento já registrado. Aguarde um instante antes de registrar outro.';

 (S.cards||[]).forEach(k=>{owed+=ccOwed(k);const yms=new Set(ccParts(k).map(p=>p.ym).concat((k.pays||[]).map(p=>p.ym)));

const MCU={};
function mcUrl(id){if(!MCU[id]){const b=atob(MCB[id]),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);MCU[id]=URL.createObjectURL(new Blob([u],{type:'image/webp'}))}return MCU[id]}
const mcDef=id=>MC.find(m=>m.id===id)||MC[0];
const mcNorm=x=>MCIDS.includes(x)?x:(MCOLD_MS[x]||'wolfin');
function lookMc(){try{const l=JSON.parse(localStorage.getItem('wallstreet.look'));return mcNorm(l&&l.m)}catch(e){return 'wolfin'}}
function mcCur(){if(SECMODE&&!DEK)return lookMc();return mcNorm(S.pref.mc)}
const mcGeo=(c,k)=>{const a=c[k],s=a[2],cyw=a[1]*c.H/c.W;return{w:10000/s,l:-(a[0]-s/2)/s*100,t:-(cyw-s/2)/s*100}};
/* avatar = recorte do rosto da MESMA imagem do mascote (nunca uma imagem separada) */
function mcAv(id,sz){const c=mcDef(id),g=mcGeo(c,'v');return `<span class="mcav" style="width:${sz}px;height:${sz}px" aria-hidden="true"><img src="${mcUrl(c.id)}" alt="" draggable="false" style="width:${g.w}%;left:${g.l}%;top:${g.t}%"></span>`}
/* mascote animado (camadas posicionadas em % da imagem; só transform/opacity) */
function mascotHtml(id,cls){
 const c=mcDef(id),g=mcGeo(c,'b'),u=mcUrl(c.id),T=c.T||{};
 const st=`--hp:${T.hp||7}s;--ha:${T.ha||.8}deg;--hy:${T.hy||.4}%;--bk:${T.bk||5}s;--br:${(T.br||.5)/100}`;
 const lids=c.e.map((e,i)=>`<svg class="slid" viewBox="0 0 100 60" preserveAspectRatio="none" style="left:${+(e[0]-e[2]/2).toFixed(2)}%;top:${+(e[1]-e[3]/2).toFixed(2)}%;width:${e[2]}%;height:${e[3]}%;--rot:${e[4]}deg;--bd:${(i*.07).toFixed(2)}s" aria-hidden="true"><ellipse cx="50" cy="30" rx="50" ry="30" fill="${e[5]}"/><path d="M12 38Q50 54 88 38" fill="none" stroke="#17120f" stroke-width="6" stroke-linecap="round" opacity=".75"/></svg>`).join('');
 const ears=(c.r||[]).map((e,i)=>`<div class="wear ${i?'R':'L'}" style="clip-path:polygon(${e[0]});--o:${e[1]};--ed:${(T.ear&&T.ear[i])||6+i*2}s;--edl:${(i*1.7+.6).toFixed(1)}s"><img src="${u}" alt="" draggable="false"></div>`).join('');
 const gl=(c.g||[]).map(e=>`<i class="mcg" style="left:${e[0]}%;top:${e[1]}%;width:${e[2]}%;--gd:${e[3]}s"></i>`).join('');
 const sw=(c.sw||[]).map(e=>`<span class="mcsw" style="left:${+(e[0]-e[2]/2).toFixed(2)}%;top:${+(e[1]-e[3]/2).toFixed(2)}%;width:${e[2]}%;height:${e[3]}%;--rot:${e[4]}deg;--gd:${e[5]}s"><i></i></span>`).join('');
 const sm=(c.sm||[]).map((e,i)=>`<i class="mcsm" style="left:${e[0]}%;top:${e[1]}%;--sd:${(i*.9).toFixed(1)}s"></i>`).join('');
 const ng=(c.ng||[]).map((e,i)=>`<i class="mcng" style="left:${e[0]}%;top:${e[1]}%;width:${+(e[2]*2).toFixed(2)}%;--nd:${(i*.37).toFixed(2)}s"></i>`).join('');
 return `<div class="wolf mc ${cls||''}" data-mc="${c.id}" data-bz="${T.bz||'n'}" role="img" aria-label="${esc(c.n)}: ${esc(c.a)} ${esc(c.t)}, seu mascote" style="${st}"><div class="mcw"><div class="mci ${T.sty||''}" style="width:${+g.w.toFixed(2)}%;left:${+g.l.toFixed(2)}%;top:${+g.t.toFixed(2)}%;aspect-ratio:${c.W}/${c.H}"><img class="mcb" src="${u}" alt="" draggable="false">${ears}${lids}${sw}${gl}${sm}${ng}</div></div></div>`}

function mcRows(sel,attr,act){return MC.map(c=>`<button type="button" role="radio" aria-checked="${c.id===sel}" class="mcrow${c.id===sel?' on':''}" ${attr}="${act}" data-id="${c.id}" aria-label="${esc(c.n)}, ${esc(c.a)}, ${esc(c.t)}${c.main?', mascote principal':''}">${mcAv(c.id,52)}<span class="mct"><b>${esc(c.n)}${c.main?'<em>Principal</em>':''}</b><small>${esc(c.a)} · ${esc(c.t)}</small><span class="mcd">${esc(c.d)}</span></span><span class="mcck" aria-hidden="true">✓</span></button>`).join('')}

   • Os dados ficam cifrados no aparelho com uma chave aleatória (DEK). A DEK fica guardada "embrulhada" duas vezes:
     pela senha e pelo código de recuperação. Trocar a senha não exige recifrar os dados.
   • A chave só existe na memória enquanto o app está aberto; fechar/recarregar = bloqueado.

const pwKey=(u,p,salt,it)=>kdf(nu(u)+'\n'+np(p),ub64(salt),it);

/* ----- controle de tentativas de acesso (senha e código de recuperação) -----
   Conta ANTES de verificar (fechar a aba no meio não escapa e tentativas paralelas não multiplicam palpites), espera progressiva
   com teto de 30 min (nunca bloqueia para sempre), guarda o estado em 3 lugares independentes (localStorage, IndexedDB e Cache)
   e usa sempre o mais restritivo: apagar só um deles não zera nada. A espera diminui sozinha com o tempo sem tentativas.
   Não toca em senha, chaves, código de recuperação nem nos dados. */

  for(const k of ['p','r']){const a=q[k];if(a&&typeof a==='object'&&Number.isFinite(a.n)&&a.n>0){o[k].n=Math.max(o[k].n,Math.min(a.n|0,99));if(Number.isFinite(a.u))o[k].u=Math.max(o[k].u,a.u);if(Number.isFinite(a.t))o[k].t=Math.max(o[k].t,a.t)}}}

/* ===== BACKUP CRIPTOGRAFADO: arquivo .json cifrado com uma senha própria (AES-256-GCM, chave derivada por PBKDF2 de 600.000 voltas) ===== */
async function saveText(fn,txt){try{const dl=window.claude&&await window.claude.use('downloads');if(dl){await dl.save({filename:fn,data:txt});return true}
 const u=URL.createObjectURL(new Blob([txt],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download=fn;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);return true}catch(e){if(e&&e.code==='declined')return false;throw e}}
function expEncForm(){form('Exportar backup criptografado',[{k:'p',l:'Senha do backup (mínimo 10 caracteres)',t:'pw',ac:'new-password'},{k:'c',l:'Repita a senha do backup',t:'pw',ac:'new-password'}],async v=>{
 if(secBusy)return'Aguarde…';if(np(v.p).length<10)return'A senha precisa ter pelo menos 10 caracteres.';if(pwFraca(v.p))return pwFraca(v.p);if(v.p!==v.c)return'As senhas não conferem.';
 secBusy=true;try{const salt=rnd(16),it=600000,sl=await seal(await kdf(np(v.p),salt,it),enc.encode(JSON.stringify(S)));
  const out=JSON.stringify({app:'wallstreet-backup',enc:true,v:1,at:todayStr(),it,s:b64(salt),iv:sl.iv,ct:sl.ct},null,1);
  if(await saveText('wolfin-backup-criptografado-'+todayStr()+'.json',out))setTimeout(()=>{toast('Backup criptografado exportado');flagBkp()},60)}catch(e){return'Não foi possível exportar.'}finally{secBusy=false}})}
/* ===== BACKUP: validação completa, confirmação com resumo, proteção contra duplicadas e importação atômica ===== */
const BK_V=2,BKYM=/^\d{4}-(0[1-9]|1[0-2])$/,BKDT=/^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$/;let IMPBUSY=0;
const bkM=(v,neg)=>Number.isSafeInteger(v)&&(neg||v>=0)&&Math.abs(v)<=1e12,bkDay=v=>Number.isInteger(v)&&v>=1&&v<=31,bkTx=v=>typeof v==='string'?v.slice(0,28):'';
async function bkpHash(str,alg){if(alg==='sha256'){const h=new Uint8Array(await crypto.subtle.digest('SHA-256',enc.encode(str)));return 'sha256:'+[...h].map(b=>b.toString(16).padStart(2,'0')).join('')}
 let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return 'fnv:'+(h>>>0).toString(16)+'-'+str.length}
const bkAlg=()=>(typeof crypto!=='undefined'&&crypto.subtle)?'sha256':'fnv';
const bkpSig=o=>bkpHash(JSON.stringify([o.owner,o.opening||null,o.limits||{},o.items,o.inst,o.parc,o.debts,o.boxes,o.cards||[],o.org||null,o.pref?[o.pref.theme,o.pref.pal,o.pref.mc,JSON.stringify(o.pref.av||null)]:null]),bkAlg());
async function bkpExportText(){let sum='';try{sum=await bkpHash(JSON.stringify(S),bkAlg())}catch(e){}return JSON.stringify({...S,__backup:{app:'wallstreet-backup',fmt:2,build:BUILD,at:new Date().toISOString(),sum}},null,1)}
function bkpScan(x,d){if(d>14)return'aninhamento excessivo';if(x&&typeof x==='object')for(const k of Object.keys(x)){if(k==='__proto__'||k==='constructor'||k==='prototype')return k;const r=bkpScan(x[k],d+1);if(r)return r}return''}
function bkpCheck(o){const E=[],W=[];
 if(!o||typeof o!=='object'||Array.isArray(o))return{E:['o conteúdo não é um backup do Wolfin (formato inesperado)'],W};
 const bad=bkpScan(o,0);if(bad)return{E:['o arquivo tem estrutura suspeita ('+bad+') e por segurança não foi aberto'],W};
 const miss=['items','inst','parc','debts','boxes'].filter(k=>!Array.isArray(o[k]));
 if(miss.length)return{E:['o arquivo está incompleto ou não é um backup do Wolfin (faltam: '+miss.join(', ')+')'],W};
 if(typeof o.owner!=='string')E.push('o nome do proprietário não é um texto válido');
 if(o.v!=null){if(!Number.isInteger(o.v)||o.v<1)E.push('a versão dos dados é inválida');else if(o.v>BK_V)E.push('ele foi feito por uma versão mais nova do aplicativo (dados v'+o.v+'); atualize o app antes de importar')}else W.push('feito por uma versão antiga do app (será atualizado)');
 if(o.limits!=null&&(typeof o.limits!=='object'||Array.isArray(o.limits)||!Object.values(o.limits).every(v=>bkM(v)&&v>0)))E.push('os limites de categoria têm valores inválidos');
 if(o.opening!=null&&(typeof o.opening!=='object'||!bkM(o.opening.c)))E.push('o saldo inicial é inválido');
 ['org','ntf','flags','pref','ach'].forEach(k=>{if(o[k]!=null&&(typeof o[k]!=='object'||Array.isArray(o[k])))E.push('o campo "'+k+'" tem formato inválido')});
 if(o.cards!=null&&!Array.isArray(o.cards))E.push('a lista de cartões é inválida');
 [['items','lançamentos'],['inst','parcelados'],['parc','parcelas'],['debts','dívidas'],['boxes','caixinhas'],['cards','cartões']].forEach(([k,n])=>{if(Array.isArray(o[k])&&o[k].length>20000)E.push('há '+n+' demais ('+o[k].length+'); o arquivo parece corrompido')});
 if(E.length)return{E,W};
 const obj=x=>x&&typeof x==='object'&&!Array.isArray(x);
 o.items.forEach((i,x)=>{if(!obj(i))return E.push('o lançamento nº '+(x+1)+' está danificado');if(i.t!=='inc'&&i.t!=='exp')return E.push('o lançamento nº '+(x+1)+' tem tipo inválido');
  const w=(i.t==='inc'?'a receita':'a despesa')+' "'+bkTx(i.d)+'" (nº '+(x+1)+')';
  if(!bkM(i.c))E.push(w+' tem valor inválido');if(i.d!=null&&typeof i.d!=='string')E.push(w+' tem descrição inválida');if(i.day!=null&&!bkDay(i.day))E.push(w+' tem dia inválido');
  if(i.fixed){if(!BKYM.test(i.from||''))E.push(w+' tem mês de início inválido')}else if(!BKYM.test(i.ym||''))E.push(w+' tem mês inválido');
  if(i.done!=null&&(!obj(i.done)||Object.entries(i.done).some(([k,v])=>!BKYM.test(k)||!bkM(v))))E.push(w+' tem registro de pagamento inválido')});
 o.inst.forEach((i,x)=>{if(!obj(i))return E.push('o parcelado nº '+(x+1)+' está danificado');if(i.n!=null&&typeof i.n!=='string')E.push('o parcelado nº '+(x+1)+' tem nome inválido');if(i.c!=null&&!bkM(i.c))E.push('o parcelado "'+bkTx(i.n)+'" tem valor inválido')});
 o.parc.forEach((p,x)=>{if(!obj(p))return E.push('a parcela nº '+(x+1)+' está danificada');if(!bkM(p.c))E.push('a parcela nº '+(x+1)+' tem valor inválido');if(!BKYM.test(p.ym||''))E.push('a parcela nº '+(x+1)+' tem mês inválido');if(p.due!=null&&p.due!==''&&!BKDT.test(p.due))E.push('a parcela nº '+(x+1)+' tem vencimento inválido')});
 o.debts.forEach((d,x)=>{if(!obj(d))return E.push('a dívida nº '+(x+1)+' está danificada');const w='a dívida "'+bkTx(d.n)+'" (nº '+(x+1)+')';if(!bkM(d.o))E.push(w+' tem valor inválido');if(d.n!=null&&typeof d.n!=='string')E.push(w+' tem nome inválido');
  if(d.due!=null&&d.due!==''&&!BKDT.test(d.due))E.push(w+' tem vencimento inválido');if(!Array.isArray(d.pays)||d.pays.some(p=>!obj(p)||!bkM(p.c,1)||!BKDT.test(p.d||'')))E.push(w+' tem pagamentos inválidos')});
 o.boxes.forEach((b,x)=>{if(!obj(b))return E.push('a caixinha nº '+(x+1)+' está danificada');const w='a caixinha "'+bkTx(b.n)+'" (nº '+(x+1)+')';if(b.n!=null&&typeof b.n!=='string')E.push(w+' tem nome inválido');
  if(b.g!=null&&!bkM(b.g))E.push(w+' tem meta inválida');if(b.m!=null&&!bkM(b.m))E.push(w+' tem valor mensal inválido');if(!Array.isArray(b.moves)||b.moves.some(p=>!obj(p)||!bkM(p.c,1)||!BKDT.test(p.d||'')))E.push(w+' tem movimentações inválidas')});
 (o.cards||[]).forEach((k,x)=>{if(!obj(k))return E.push('o cartão nº '+(x+1)+' está danificado');const w='o cartão "'+bkTx(k.n)+'" (nº '+(x+1)+')';if(typeof k.n!=='string')E.push(w+' tem nome inválido');if(!bkM(k.lim))E.push(w+' tem limite inválido');if(!bkDay(k.cl)||!bkDay(k.dd))E.push(w+' tem dia de fechamento/vencimento inválido');
  if(!Array.isArray(k.buys)||k.buys.some(b=>!obj(b)||!bkM(b.c)||!BKDT.test(b.dt||'')||!Number.isInteger(b.np)||b.np<1||b.np>120))E.push(w+' tem compras inválidas');if(!Array.isArray(k.pays)||k.pays.some(p=>!obj(p)||!bkM(p.c)||!BKYM.test(p.ym||'')||!BKDT.test(p.d||'')))E.push(w+' tem pagamentos inválidos')});
 const dup=a=>{const s=new Set();let n=0;a.forEach(i=>{if(obj(i)&&typeof i.id==='string'){if(s.has(i.id))n++;s.add(i.id)}});return n},dn=['items','inst','parc','debts','boxes'].reduce((a,k)=>a+dup(o[k]),0);
 if(dn)W.push(dn+(dn>1?' registros com identificação repetida':' registro com identificação repetida'));
 return{E,W}}
const bkCnt=x=>({inc:x.items.filter(i=>i.t==='inc').length,exp:x.items.filter(i=>i.t==='exp').length,debts:x.debts.length,parc:x.parc.length,boxes:x.boxes.length,cards:(x.cards||[]).length});
const bkRes=c=>[[c.inc,'receita','receitas'],[c.exp,'despesa','despesas'],[c.debts,'dívida','dívidas'],[c.parc,'parcela','parcelas'],[c.boxes,'caixinha','caixinhas'],[c.cards,'cartão','cartões']].filter(x=>x[0]>0).map(x=>x[0]+' '+(x[0]===1?x[1]:x[2])).join(', ')||'nenhum registro';
/* verifica TUDO antes de mexer em qualquer dado: devolve {err} | {same} | {n (cópia já normalizada), msg, sig, resumo} */
async function bkpPrepare(o,meta,welcome){const fail=m=>({err:'Backup inválido: '+m+'. Seus dados atuais não foram alterados.'});
 const {E,W}=bkpCheck(o);if(E.length)return fail(E[0]+(E.length>1?' (e mais '+(E.length-1)+(E.length>2?' problemas)':' problema)'):''));
 const mt=o.__backup;
 if(mt!=null){if(!mt||typeof mt!=='object'||Array.isArray(mt))return fail('o selo de integridade está danificado');
  if(typeof mt.sum==='string'){const {__backup,...rest}=o,al=mt.sum.split(':')[0];if(al==='fnv'||(al==='sha256'&&typeof crypto!=='undefined'&&crypto.subtle)){if(await bkpHash(JSON.stringify(rest),al)!==mt.sum)return fail('o arquivo foi alterado ou está corrompido (a verificação de integridade falhou)')}}}
 let n;try{n=JSON.parse(JSON.stringify(o))}catch(e){return fail('não foi possível ler o conteúdo')}
 delete n.__backup;if(!valid(n)||typeof n.owner!=='string')return fail('os dados não passaram na verificação de estrutura');
 migrate(n);if(!n.pref||typeof n.pref!=='object')n.pref=S.pref;fixPref(n);
 const sig=await bkpSig(n);if(!welcome&&sig===await bkpSig(S))return{same:true};
 const a=bkCnt(n),b=bkCnt(S),at=(meta&&meta.at)||(mt&&typeof mt.at==='string'?mt.at.slice(0,10):''),ws=W.slice();
 [['inc','receitas'],['exp','despesas'],['debts','dívidas'],['parc','parcelas'],['boxes','caixinhas'],['cards','cartões']].forEach(([k,t])=>{if(b[k]>a[k])ws.push('o backup tem menos '+t+' ('+a[k]+') do que os seus dados atuais ('+b[k]+')')});
 const lb=S.flags&&S.flags.bkpAt;if(BKDT.test(at)&&BKDT.test(lb||'')&&at<lb)ws.push('ele é mais antigo que o seu último backup ('+dmy(lb)+')');
 const ja=((S.flags&&Array.isArray(S.flags.imp))?S.flags.imp:[]).find(x=>x&&x.h===sig);if(ja)ws.push('você já importou este mesmo backup em '+dmy(ja.at));
 const resumo=bkRes(a);
 const msg='Importar o backup'+(BKDT.test(at)?' de '+dmy(at):'')+' de "'+(n.owner||'sem nome')+'" ('+resumo+')? Seus dados atuais ('+bkRes(b)+') serão SUBSTITUÍDOS e isso não pode ser desfeito.'+(ws.length?' Atenção: '+ws.join('; ')+'.':'')+' Continuar?';
 return{n,sig,msg,resumo}}
/* aplica de uma vez; se gravar falhar, volta tudo como estava */
async function bkpApply(r){if(IMPBUSY)return;IMPBUSY=1;const prev=S,prevOpen=open;
 try{const n=r.n;n.flags=(n.flags&&typeof n.flags==='object')?n.flags:{};n.flags.bkpAt=todayStr();n.flags.imp=[{h:r.sig,at:todayStr()},...((prev.flags&&Array.isArray(prev.flags.imp))?prev.flags.imp:[])].slice(0,6);
  S=n;open={};const nw=achCheck();let okS=false;try{okS=SECMODE?(DEK?await persist():false):save()}catch(e){okS=false}
  if(!okS){S=prev;open=prevOpen;render();toast('A importação foi cancelada: não foi possível gravar. Seus dados atuais foram mantidos.',6000);return}
  render();toast('Backup importado ✓ — '+r.resumo,5000);if(nw.length)celebrate(nw)}
 catch(e){S=prev;open=prevOpen;try{render()}catch(x){}toast('A importação foi cancelada por um erro. Seus dados atuais foram mantidos.',6000)}
 finally{IMPBUSY=0}}
async function importObj(o,meta){if(IMPBUSY)return toast('Já existe uma importação em andamento.');IMPBUSY=1;let r;
 try{r=await bkpPrepare(o,meta)}catch(e){r={err:'Não foi possível verificar o arquivo. Seus dados atuais não foram alterados.'}}finally{IMPBUSY=0}
 if(r.err)return toast(r.err,7000);if(r.same)return toast('Este backup é igual aos dados atuais — nada foi alterado.',6000);
 ask(r.msg,()=>bkpApply(r))}
function importEnc(o){if(!hasCrypto)return toast('Este navegador não consegue abrir backups criptografados (precisa de https).');
 if(!(Number.isInteger(o.it)&&o.it>=100000&&o.it<=2000000)||typeof o.s!=='string'||typeof o.iv!=='string'||typeof o.ct!=='string')return toast('Backup criptografado danificado ou incompleto. Seus dados atuais não foram alterados.',6000);
 if(o.v!=null&&(!Number.isInteger(o.v)||o.v>1))return toast('Backup criptografado de uma versão mais nova do app; atualize o app antes de importar.',6000);
 form('Backup criptografado',[{k:'p',l:'Senha do backup',t:'pw',ac:'current-password'}],async v=>{if(secBusy)return'Aguarde…';secBusy=true;let d;
  try{d=JSON.parse(dec.decode(await unseal(await kdf(np(v.p),ub64(o.s),o.it),{iv:o.iv,ct:o.ct})))}catch(e){return'Senha incorreta ou arquivo corrompido.'}finally{secBusy=false}
  setTimeout(()=>importObj(d,{at:o.at}),60)})}
