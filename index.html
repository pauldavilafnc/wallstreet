/* ===== lobo 2D (mascote principal): camadas posicionadas em % do palco; animações só com transform ===== */
.wolf{position:relative;width:100%;aspect-ratio:760/1050;overflow:hidden;pointer-events:none;-webkit-user-select:none;user-select:none}
.wolf.bust{aspect-ratio:760/600}.wolf.lkw{width:min(190px,54vw);aspect-ratio:760/640;margin:0 auto 4px}
.wst{position:absolute;left:0;top:0;width:100%;aspect-ratio:760/1050;-webkit-mask-image:linear-gradient(#000 78%,transparent);mask-image:linear-gradient(#000 78%,transparent)}
.wst img{position:absolute;display:block;pointer-events:none}.wbody{object-fit:fill}
.whead{position:absolute;inset:0;transform-origin:47.4% 41%;animation:wsway 7s ease-in-out infinite;will-change:transform}
.wear{position:absolute;inset:0}.wear.L{transform-origin:33.6% 20%}.wear.R{transform-origin:57.9% 19.5%}
.wear.L.fl{animation:wflickl .55s ease-in-out}.wear.R.fl{animation:wflickr .55s ease-in-out}

.wolf.bl .weye{transform:scaleY(.12)}.wp{transform:translate(var(--px,2px),var(--py,0px));transition:transform .4s ease}
.wolf.nod .whead{animation:wnod .7s ease-in-out}
@keyframes wsway{0%,100%{transform:rotate(-.5deg) translateY(0)}50%{transform:rotate(.7deg) translateY(-.3%)}}

@keyframes wflickr{0%,100%{transform:none}35%{transform:rotate(3.5deg) translateY(-.4%)}65%{transform:rotate(-1.5deg)}}

<script>
/* ===== WALL STREET — Seu dinheiro, sob controle. =====
   Valores internos em CENTAVOS inteiros. Dados em localStorage. */
'use strict';
const KEY='wallstreet.v1',BUILD='4.0 · identidade lobo e vidro · 08/11/2026';
const CATS={exp:['Alimentação','Transporte','Compras','Roupas','Lazer','Trabalho','Casa','Saúde','Educação','Financeiro','Tecnologia','Cuidados pessoais','Presentes','Outros'],inc:['Salário','Comissão','Freelancer','Outro']};
const PAYS=['Pix','Cartão de débito','Cartão de crédito','Dinheiro/Espécie','Outro'];
const MN=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const pad=n=>String(n).padStart(2,'0');
let HIDE=0;
const brl0=c=>{const n=Math.abs(Math.round(c));return (c<0?'-':'')+'R$ '+String(Math.floor(n/100)).replace(/\B(?=(\d{3})+(?!\d))/g,'.')+','+pad(n%100)};
const brl=c=>HIDE?'R$ •••••':brl0(c);
const fin=c=>c==null?'':(c/100).toFixed(2).replace('.',',');
function parseMoney(s){ // "1.234,56" -> 123456 ; vazio/invalid -> null
  s=String(s||'').replace(/[R$\s]/g,'');if(!s)return null;
  if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');else if(/\.\d{3}$/.test(s))s=s.replace(/\./g,'');
  const n=Number(s);return isFinite(n)&&n>=0?Math.round(n*100):NaN}
const ymOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1);
const todayStr=()=>{const d=new Date();return ymOf(d)+'-'+pad(d.getDate())};
const shift=(ym,k)=>{const [y,m]=ym.split('-').map(Number);return ymOf(new Date(y,m-1+k,1))};
const mlabel=ym=>{const [y,m]=ym.split('-');return MN[m-1]+' de '+y};
const dmy=d=>d.split('-').reverse().join('/');

/* ----- dados iniciais ----- */
function seed(){return{v:2,owner:"Paul",opening:null,limits:{},ntf:{read:{}},pref:{theme:'light',pal:'blue',av:{v:2,m:0,an:1,set:0}},items:[],inst:[],parc:[],debts:[],boxes:[]}}

function valid(o){return o&&typeof o==='object'&&(o.limits==null||(typeof o.limits==='object'&&Object.values(o.limits).every(v=>Number.isInteger(v)&&v>0)))&&(o.opening==null||(typeof o.opening==='object'&&Number.isInteger(o.opening.c)&&o.opening.c>=0))&&['items','inst','parc','debts','boxes'].every(k=>Array.isArray(o[k]))&&
 o.items.every(i=>i&&Number.isInteger(i.c)&&i.c>=0&&(i.t==='inc'||i.t==='exp'))&&o.debts.every(d=>d&&Number.isInteger(d.o)&&Array.isArray(d.pays)&&d.pays.every(p=>Number.isInteger(p.c)&&typeof p.d==='string'))&&
 o.boxes.every(b=>b&&Array.isArray(b.moves)&&b.moves.every(p=>Number.isInteger(p.c)&&typeof p.d==='string'))&&o.parc.every(p=>p&&Number.isInteger(p.c)&&/^\d{4}-\d{2}$/.test(p.ym))}
let SECMODE=false,DEK=null,SECOBJ=null,persistQ=Promise.resolve(),FIRST=false;try{SECMODE=!!localStorage.getItem('wallstreet.sec');FIRST=!SECMODE&&localStorage.getItem(KEY)===null&&!localStorage.getItem('wallstreet.welcomed')}catch(e){}
let S;
try{if(SECMODE)throw 0;const r=localStorage.getItem(KEY);S=r?JSON.parse(r):null;
 if(r){ // cópia de segurança dos dados antes de qualquer migração/descarte
  if(S&&(S.v||1)<2&&!localStorage.getItem(KEY+'.pre-v2'))localStorage.setItem(KEY+'.pre-v2',r);
  if(!valid(S)){localStorage.setItem(KEY+'.invalido-'+Date.now(),r);S=null}}}catch(e){S=null}
if(!S){S=seed();}
function migrate(o){ // v2: saldo inicial, notificações, conquistas; parcelas antigas pertencem ao Celular
 if(o.ach===undefined)o.ach=null;if(!o.limits||typeof o.limits!=='object')o.limits={};if(!o.flags||typeof o.flags!=='object')o.flags={};
 if(o.opening===undefined)o.opening=null;if(!o.ntf||typeof o.ntf!=='object'||!o.ntf.read)o.ntf={read:{}};if(!o.ntf.since){const d=new Date();o.ntf.since=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}o.v=2;
 delete o.games;ensureOrg(o);if(o.pref&&typeof o.pref==='object'&&typeof fixPref==='function')fixPref(o);o.boxes.forEach(b=>{if(!['cofre','moto','carro','casa','viagem','celular','computador','estudos','presente','emergencia','saude','bike'].includes(b.ic))b.ic='cofre'});
 const orphan=o.parc.filter(p=>!p.iid||!o.inst.some(x=>x.id===p.iid));
 if(orphan.length){let t=o.inst.find(x=>x.n==='Celular')||o.inst[0];if(!t){t={id:uid(),n:'Parcelado',c:null,np:null,day:null,paid:false};o.inst.push(t)}orphan.forEach(p=>{p.iid=t.id})}return o}
const fixPref=o=>{if(!o.pref||typeof o.pref!=='object')o.pref={theme:'light',pal:'blue'};if(typeof o.pref.lk!=='number')o.pref.lk=5;if(typeof o.pref.br!=='number')o.pref.br=7;if(typeof o.pref.gl!=='number')o.pref.gl=1;if(o.pref.br===14)o.pref.br=15;delete o.pref.vz;const a=o.pref.av;const ci=(v,n)=>{v=Math.floor(+v||0);return v>=0&&v<n?v:0};o.pref.av=(a&&typeof a==='object')?{v:2,m:a.v===2?ci(a.m,10):0,an:(a.an===0||a.an===false)?0:1,set:a.v===2&&a.set?1:0}:{v:2,m:0,an:1,set:0};o.pref.hide=o.pref.hide?1:0;if(o.pref.pal==='rose')o.pref.pal='pink';return o};fixPref(S);migrate(S);
function lookPref(){try{const l=JSON.parse(localStorage.getItem('wallstreet.look'));if(l&&l.t)return{theme:l.t,pal:l.p,gl:l.g}}catch(e){}return{theme:'light',pal:'blue'}}
function applyPref(){const p=(SECMODE&&!DEK)?lookPref():S.pref,r=document.documentElement;HIDE=p.hide?1:0;r.dataset.theme=p.theme==='dark'?'dark':'light';r.dataset.pal=['blue','violet','teal','pink','orange','ouro','esmeralda','grafite'].includes(p.pal)?p.pal:'blue';const m=document.querySelector('meta[name=theme-color]');if(m)m.content=p.theme==='dark'?'#0B1220':'#0B1730';try{r.dataset.glass=p.gl===0?'off':'on';localStorage.setItem('wallstreet.look',JSON.stringify({t:r.dataset.theme,p:r.dataset.pal,g:p.gl===0?0:1}))}catch(e){}}
let view='home',vm=ymOf(new Date()),ry=new Date().getFullYear(),rm='',pend=null,open={};
function save(){if(FIRST)return true;if(SECMODE){if(!DEK)return false;persist();return true}try{localStorage.setItem(KEY,JSON.stringify(S));return true}catch(e){toast('Não foi possível salvar (armazenamento cheio ou bloqueado)');return false}}
save();
function toast(m){const t=$('#toast');t.textContent=m;t.className='s';clearTimeout(toast.h);toast.h=setTimeout(()=>t.className='',1800)}
function commit(msg){const nw=achCheck();if(save())toast(msg||'Salvo ✓');render();if(nw.length)celebrate(nw)}

/* ----- cálculos ----- */
const rowsOf=(t,m)=>S.items.filter(i=>i.t===t&&(i.fixed?m>=i.from:i.ym===m)).sort((a,b)=>a.day-b.day);
function due(i,m){const [y,mo]=m.split('-').map(Number);return new Date(y,mo-1,Math.min(i.day,new Date(y,mo,0).getDate()),23,59,59)}
const stat=(i,m)=>i.done&&i.done[m]!=null?'ok':(due(i,m)<new Date()?'late':'pend');
const slabel=(i,s)=>s==='ok'?(i.t==='inc'?'Recebido':'Pago'):s==='late'?'Atrasado':'Pendente';
const sum=(a,f)=>a.reduce((x,y)=>x+f(y),0);
const paidOf=d=>sum(d.pays,p=>p.c),balOf=d=>d.o-paidOf(d);
const savedOf=b=>sum(b.moves,p=>p.c);
function flows(){const m={},g=k=>m[k]||(m[k]={inc:0,exp:0,dp:0,bx:0});
 S.items.forEach(i=>Object.entries(i.done||{}).forEach(([k,c])=>{g(k)[i.t]+=c}));
 S.debts.forEach(d=>d.pays.forEach(p=>{g(p.d.slice(0,7)).dp+=p.c}));
 S.boxes.forEach(b=>b.moves.forEach(p=>{g(p.d.slice(0,7)).bx+=p.c}));return m}
const net=x=>x.inc-x.exp-x.dp-x.bx;
const balance=()=>Object.values(flows()).reduce((a,x)=>a+net(x),0)+(S.opening?S.opening.c:0);

/* ----- gráficos SVG (sem bibliotecas, funcionam offline) ----- */
let CHN=0;
function chart(labels,series,colors,o={}){
 const W=340,H=o.h||150,pt=16,pb=20,all=series.flat(),hi=Math.max(0,...all),lo=Math.min(0,...all),rg=(hi-lo)||1,id='cg'+(++CHN);
 const y=v=>pt+(hi-v)/rg*(H-pt-pb),n=labels.length,gw=W/n,bw=gw*.6/series.length,base=H-pb;
 let s=`<svg viewBox="0 0 ${W} ${H}" role="img"><defs>${colors.map((c,k)=>`<linearGradient id="${id}${k}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:${c}" stop-opacity="1"/><stop offset="1" style="stop-color:${c}" stop-opacity=".5"/></linearGradient>`).join('')}${o.line?`<linearGradient id="${id}a" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:${colors[0]}" stop-opacity=".34"/><stop offset="1" style="stop-color:${colors[0]}" stop-opacity="0"/></linearGradient>`:''}</defs>`;
 [.25,.5,.75].forEach(f=>{const gy=pt+f*(H-pt-pb);s+=`<line x1="0" x2="${W}" y1="${gy}" y2="${gy}" stroke-dasharray="2 5" stroke-linecap="round" style="stroke:var(--line)" opacity=".7"/>`});
 s+=`<line x1="0" x2="${W}" y1="${y(0)}" y2="${y(0)}" style="stroke:var(--line)" stroke-width="1.5"/>`;
 if(o.line){const P=series[0].map((v,i)=>[(i+.5)*gw,y(v)]),k=i=>P[Math.max(0,Math.min(P.length-1,i))];
  let d=`M${P[0][0]} ${P[0][1]}`;for(let i=0;i<P.length-1;i++){const a=k(i-1),b=k(i),c=k(i+1),e=k(i+2);d+=`C${(b[0]+(c[0]-a[0])/6).toFixed(1)} ${(b[1]+(c[1]-a[1])/6).toFixed(1)} ${(c[0]-(e[0]-b[0])/6).toFixed(1)} ${(c[1]-(e[1]-b[1])/6).toFixed(1)} ${c[0]} ${c[1]}`}
  s+=`<path d="${d}L${P[P.length-1][0]} ${base}L${P[0][0]} ${base}Z" fill="url(#${id}a)" stroke="none"/><path d="${d}" fill="none" stroke-linecap="round" stroke-linejoin="round" style="stroke:${colors[0]}" stroke-width="2.6"/>`+P.map(q=>`<circle cx="${q[0]}" cy="${q[1]}" r="3.4" stroke="#fff" stroke-opacity=".9" stroke-width="1.4" style="fill:${colors[0]}"/>`).join('')}
 else series.forEach((sr,k)=>sr.forEach((v,i)=>{const x=i*gw+gw*.2+k*bw,y1=y(Math.max(v,0)),y2=y(Math.min(v,0));
  s+=`<rect x="${x}" y="${y1}" width="${bw}" height="${Math.max(2,y2-y1)}" rx="${Math.min(5,bw/2)}" ${o.cc?`style="fill:${o.cc[i]}"`:`fill="url(#${id}${k})"`}/>`;
  if(o.val)s+=`<text x="${x+bw/2}" y="${y1-4}" font-size="10" text-anchor="middle" style="fill:var(--navy)">${brl(v)}</text>`}));
 labels.forEach((l,i)=>{s+=`<text x="${(i+.5)*gw}" y="${H-5}" font-size="10" font-weight="600" text-anchor="middle" style="fill:var(--gray)">${l}</text>`});
 return s+'</svg>'}
const noData=m=>`<div class="empty">${m||'Ainda não há dados suficientes. Marque lançamentos como recebidos ou pagos para ver o gráfico.'}</div>`;

/* ----- telas ----- */
const bar=(p,c='')=>`<div class="bar ${c}"><i style="width:${Math.max(0,Math.min(100,p))}%"></i></div>`;
function itemRow(i,m,btns=true){const s=stat(i,m);
 return `<div class="row"><div class="t"><b>${esc(i.d)}</b><span class="lbl">${i.t==='exp'?(i.fixed?'Vence dia '+pad(i.day):'Data '+dmy((i.dt&&i.dt.startsWith(m+'-')?i.dt:m+'-'+pad(Math.min(i.day,dimOf(m)))))):'Dia '+pad(i.day)}${i.cat?' · '+esc(i.cat):''}${i.pay?' · '+esc(i.pay):''}${i.fixed?' · mensal':''}${s==='ok'&&i.paidOn&&i.paidOn[m]?' · '+(i.t==='inc'?'recebido':'pago')+' em '+dmy(i.paidOn[m]):''}</span></div>
 <div class="a"><span class="${i.t==='inc'?'pos':'neg'}">${brl(i.c)}</span><br><span class="tag ${s}">${slabel(i,s)}</span></div>
 ${btns?`<button class="ib" data-act="tog" data-id="${i.id}" data-m="${m}" aria-label="Marcar">${s==='ok'?'↺':'✓'}</button>`:''}</div>`}

function ring(p,c){const r=22,L=2*Math.PI*r,d=Math.max(0,Math.min(100,p))/100*L;
 return `<svg viewBox="0 0 56 56" style="width:56px;height:56px;flex:none"><circle cx="28" cy="28" r="${r}" fill="none" style="stroke:var(--light)" stroke-width="6"/><circle cx="28" cy="28" r="${r}" fill="none" style="stroke:${c||'var(--blue)'}" stroke-width="6" stroke-linecap="round" stroke-dasharray="${d} ${L}" transform="rotate(-90 28 28)"/><text x="28" y="32" font-size="12" font-weight="700" text-anchor="middle" style="fill:var(--navy)">${Math.round(p)}%</text></svg>`}

     pela senha e pelo código de recuperação. Trocar a senha não exige recifrar os dados.
   • A chave só existe na memória enquanto o app está aberto; fechar/recarregar = bloqueado.

function viewWelcome(){WEL.on=true;WEL.nosec=false;WEL.ctx='';lockUI(`<h2 style="text-align:center">Boas-vindas!</h2><p class="lbl" style="text-align:center;margin:6px 0 16px">Organize receitas, despesas, dívidas e metas em um só lugar. Seus dados ficam guardados <b>só neste aparelho</b>.</p><button class="b1 full" data-lk="new" style="margin-bottom:10px">Criar minha conta</button><button class="b2 full" data-lk="have">Já tenho uma conta</button><p style="text-align:center;margin-top:14px"><button class="b2" data-lk="nosec" style="font-size:13px">Usar sem senha por enquanto</button></p>`,'wave')}
function viewName(msg){lockUI(`<h2 style="text-align:center">Como podemos te chamar?</h2><p class="lbl" style="text-align:center;margin:6px 0 12px">Esse nome aparece nas saudações do app.</p><form id="nf"><label>Seu nome<input name="n" autocomplete="given-name" maxlength="30" value="${esc(WEL.name)}"></label><div class="err" id="le">${esc(msg||'')}</div><button class="b1 full">${WEL.nosec||!hasCrypto?'Começar':'Continuar'}</button></form><p style="text-align:center;margin-top:14px"><button class="b2" data-lk="back0">Voltar</button></p>`)}
function viewHave(msg){lockUI(`<h2 style="text-align:center">Já tenho uma conta</h2><p class="lbl" style="text-align:center;margin:6px 0 12px">Seus dados ficam guardados no aparelho, e não em um servidor. Para usar sua conta aqui, importe o <b>backup</b> que você exportou antes (arquivo .json, comum ou criptografado).</p><div class="err" id="le">${esc(msg||'')}</div><button class="b1 full" data-lk="pickbk">Escolher arquivo de backup</button><p class="lbl" style="margin:12px 0">Ainda não tem o arquivo? No aparelho onde você já usa o app, abra Ajustes → Exportar backup (de preferência o criptografado) e envie o arquivo para este aparelho por e-mail, Drive ou WhatsApp.</p><p style="text-align:center"><button class="b2" data-lk="back0">Voltar</button></p>`,'wave')}
function viewBkPw(o,msg){WEL.bk=o;lockUI(`<h2 style="text-align:center">Backup criptografado</h2><p class="lbl" style="text-align:center;margin:6px 0 12px">Digite a senha que você escolheu ao exportar este backup.</p><form id="bf"><label>Senha do backup<div class="pw"><input name="p" type="password" autocomplete="current-password">${eye}</div></label><div class="err" id="le">${esc(msg||'')}</div><button class="b1 full">Abrir backup</button></form><p style="text-align:center;margin-top:14px"><button class="b2" data-lk="have">Voltar</button></p>`)}
function finishNoSec(){try{localStorage.setItem('wallstreet.secskip','1')}catch(e){}achCheck(true);markWelcomed();WEL.on=false;G=null;save();closeLk();render();toast('Tudo pronto, '+(S.owner.split(' ')[0]||'')+'!')}
function welApply(o){if(!valid(o)||typeof o.owner!=='string')return viewHave('Arquivo inválido: não é um backup do WALL STREET.');migrate(o);if(!o.pref||typeof o.pref!=='object')o.pref=S.pref;fixPref(o);o.flags=(o.flags&&typeof o.flags==='object')?o.flags:{};o.flags.bkpAt=todayStr();S=o;G=null;open={};viewSetup(false,'import')}
function welImport(f){if(f.size>5e6)return viewHave('Arquivo grande demais.');const r=new FileReader();r.onload=()=>{let o;try{o=JSON.parse(r.result)}catch(x){return viewHave('Arquivo inválido: não é um JSON.')}
 if(o&&o.app==='wallstreet-backup'&&o.enc===true){if(!hasCrypto)return viewHave('Este navegador não abre backups criptografados (precisa de https).');if(!(Number.isInteger(o.it)&&o.it>=100000&&o.it<=2000000)||typeof o.s!=='string'||typeof o.iv!=='string'||typeof o.ct!=='string')return viewHave('Arquivo inválido: backup criptografado danificado.');return viewBkPw(o)}
 welApply(o)};r.onerror=()=>viewHave('Falha ao ler o arquivo.');r.readAsText(f)}
function viewCode(code,next,title){CODE_NEXT=next;lockUI(`<h2 style="text-align:center">${title||'Código de recuperação'}</h2><p class="lbl" style="text-align:center;margin:6px 0 12px">Se você esquecer a senha, <b>este código é a única forma</b> de recuperar os dados. Anote em papel ou guarde fora deste celular. Ele <b>não será mostrado de novo</b>.</p><div class="code" id="skcode">${code}</div><div class="acts" style="justify-content:center"><button class="b2" data-lk="copy">Copiar código</button></div><label style="display:flex;gap:10px;align-items:center;margin:14px 0;color:var(--navy)"><input type="checkbox" id="skok" style="width:24px;height:24px;min-height:24px;margin:0;flex:none"> Guardei o código em lugar seguro</label><div class="err" id="skerr"></div><button class="b1 full" id="skdone" data-lk="done" disabled>Concluir</button>`)}
const closeLk=()=>{LK.hidden=true;LK.innerHTML='';CODE_NEXT=null};
async function openApp(dek,data,sec){if(!valid(data)){viewLogin('Os dados protegidos estão inválidos. Use o código de recuperação ou importe um backup.');return}
 fixPref(migrate(data));S=data;if(LOCKTHEME){S.pref.theme=LOCKTHEME;LOCKTHEME=null}DEK=dek;SECOBJ=sec;SEC0=sec;achCheck(true);document.body.classList.remove('locked');closeLk();G=null;render();loadNews();save();setTimeout(ntCheck,600)}
async function lockNow(){try{await persistQ}catch(e){}location.reload()}
async function finishSetup(st,u,p){localStorage.setItem(SECK,JSON.stringify(st.sec));
 const chk=await tryPw(st.sec,u,p);if(!chk||JSON.stringify(chk.data)!==(st.snap||JSON.stringify(S))){localStorage.removeItem(SECK);throw new Error('verificação')}
 SECOBJ=st.sec;SEC0=st.sec;DEK=chk.dek;SECMODE=true;Object.keys(localStorage).filter(k=>k===KEY||k.startsWith(KEY+'.pre-v2')||k.startsWith(KEY+'.invalido-')).forEach(k=>localStorage.removeItem(k));persist();markWelcomed();WEL.on=false}
LK.addEventListener('click',async e=>{const b=e.target.closest('[data-lk]');if(!b)return;const a=b.dataset.lk;
 if(a==='eye'){const i=b.parentElement.querySelector('input');i.type=i.type==='password'?'text':'password';b.classList.toggle('on',i.type==='text');b.setAttribute('aria-pressed',i.type==='text'?'true':'false');wolfState(i.type==='password'?'cl':'dn')}
 else if(a==='theme')lockTheme();else if(a==='rec')viewRecover();else if(a==='back')viewLogin();else if(a==='skip'){try{localStorage.setItem('wallstreet.secskip','1')}catch(x){}if(FIRST||WEL.on){achCheck(true);markWelcomed();WEL.on=false;save();closeLk();render();toast('Tudo pronto!')}else closeLk()}else if(a==='cancel')closeLk();
 else if(a==='new'){WEL.nosec=false;viewName()}else if(a==='nosec'){WEL.nosec=true;viewName()}else if(a==='have')viewHave();else if(a==='back0')viewWelcome();else if(a==='backname')viewName();else if(a==='pickbk'){WEL.pick=true;$('#file').value='';$('#file').click()}
 else if(a==='copy'){try{await navigator.clipboard.writeText($('#skcode').textContent);b.textContent='Copiado ✓'}catch(x){b.textContent='Copie manualmente (toque no código)'}}
 else if(a==='done'&&CODE_NEXT&&!secBusy){secBusy=true;b.disabled=true;b.textContent='Salvando…';try{await CODE_NEXT()}catch(x){$('#skerr').textContent='Não foi possível concluir. Seus dados continuam como estavam. Tente novamente.';b.disabled=false;b.textContent='Concluir'}secBusy=false}});
LK.addEventListener('change',e=>{if(e.target.id==='skok')$('#skdone').disabled=!e.target.checked});
LK.addEventListener('submit',async e=>{e.preventDefault();if(secBusy)return;const id=e.target.id,f=Object.fromEntries(new FormData(e.target)),btn=e.target.querySelector('button:not([type=button])'),err=m=>{const x=$('#le');if(x)x.textContent=m};
 const go=async fn=>{secBusy=true;const t=btn.textContent;btn.disabled=true;btn.textContent='Verificando…';try{await fn()}catch(x){err('Algo deu errado. Tente novamente.');console.error(x)}secBusy=false;if($('#'+id)){btn.disabled=false;btn.textContent=t}};
 if(id==='lf'){if(failWait())return;await go(async()=>{const r=await tryPw(SEC0,f.u,f.p);if(!r){failAdd();viewLogin('Usuário ou senha incorretos.');return}try{localStorage.removeItem(FK)}catch(x){}await openApp(r.dek,r.data,SEC0)})}
 else if(id==='rf'){if(failWait()){err('Muitas tentativas. Aguarde '+failWait()+'s.');return}const m=pwErr(f.u,f.p,f.c);if(m){err(m);return}
  await go(async()=>{const r=await tryCode(SEC0,f.k);if(!r){failAdd();err('Código de recuperação inválido.');return}try{localStorage.removeItem(FK)}catch(x){}
   const {sec,code}=await wrapAll(f.u,f.p,r.raw,true);sec.d=SEC0.d;viewCode(code,async()=>{localStorage.setItem(SECK,JSON.stringify(sec));await openApp(r.dek,r.data,sec);toast('Senha redefinida ✓')},'Novo código de recuperação')})}
 else if(id==='nf'){const nm=String(f.n||'').trim().replace(/\s+/g,' ');if(!nm){err('Digite seu nome.');return}if(nm.length>30){err('Use no máximo 30 caracteres.');return}WEL.name=nm;S.owner=nm;G=null;if(WEL.nosec||!hasCrypto)finishNoSec();else viewSetup(false,'welcome')}
 else if(id==='bf'){const o=WEL.bk;await go(async()=>{let d;try{d=JSON.parse(dec.decode(await unseal(await kdf(np(f.p),ub64(o.s),o.it),{iv:o.iv,ct:o.ct})))}catch(x){viewBkPw(o,'Senha incorreta ou arquivo corrompido.');return}welApply(d)})}
 else if(id==='sf'){const m=pwErr(f.u,f.p,f.c);if(m){err(m);return}
  await go(async()=>{const dek=await crypto.subtle.generateKey({name:'AES-GCM',length:256},true,['encrypt','decrypt']),raw=new Uint8Array(await crypto.subtle.exportKey('raw',dek)),{sec,code}=await wrapAll(f.u,f.p,raw,true);const snap=JSON.stringify(S);sec.d=await seal(dek,enc.encode(snap));
   viewCode(code,async()=>{await finishSetup({sec,snap},f.u,f.p);closeLk();render();toast(WEL.ctx==='welcome'?'Conta criada! Tudo pronto ✓':'Proteção ativada ✓');WEL.ctx=''},'Seu código de recuperação')})}});
/* ----- Ajustes → Segurança ----- */
function secCard(){if(!hasCrypto)return'<div class="card"><h3>Segurança</h3><p class="lbl">Este navegador/endereço não permite criptografia (precisa de conexão segura, https).</p></div>';
 if(!SECMODE)return`<div class="card"><h3>Segurança</h3><p class="lbl" style="margin-bottom:8px">Proteção por usuário e senha <b>desativada</b>. Qualquer pessoa com acesso a este navegador vê seus dados.</p><button class="b1 full" data-act="secon">Ativar proteção</button></div>`;
 const lk=S.pref.lk;return`<div class="card"><h3>Segurança <span class="tag ok">Protegido</span></h3><p class="lbl" style="margin-bottom:8px">Dados criptografados neste aparelho (AES-256). Usuário: <b>${esc(SECOBJ.u)}</b>. O backup comum <b>não</b> é criptografado; use "Exportar backup criptografado" em Backup.</p>
 <label>Bloquear automaticamente<select id="lkSel">${[[1,'Após 1 minuto fora do app'],[5,'Após 5 minutos fora do app'],[15,'Após 15 minutos fora do app'],[-1,'Só ao fechar o app']].map(([v,t])=>`<option value="${v}"${lk===v?' selected':''}>${t}</option>`).join('')}</select></label>
 <div class="acts"><button class="b1" data-act="seclock">Bloquear agora</button><button class="b2" data-act="secchg">Alterar senha</button><button class="b2" data-act="secnew">Novo código</button><button class="b2" data-act="secoff">Remover</button></div></div>`}
document.addEventListener('change',e=>{if(e.target.id==='lkSel'){S.pref.lk=+e.target.value;commit('Bloqueio automático alterado')}});
const needPw=async cur=>{const r=await tryPw(SECOBJ,SECOBJ.u,cur);return r};
function chgForm(){form('Alterar usuário/senha',[{k:'cur',l:'Senha atual',t:'pw',ac:'current-password'},{k:'u',l:'Usuário',v:SECOBJ.u,ac:'username'},{k:'p',l:'Nova senha (mínimo 8)',t:'pw',ac:'new-password'},{k:'c',l:'Repita a nova senha',t:'pw',ac:'new-password'}],async v=>{
 if(secBusy)return'Aguarde…';const m=pwErr(v.u,v.p,v.c);if(m)return m;secBusy=true;try{if(failWait())return'Muitas tentativas. Aguarde '+failWait()+'s.';if(!await needPw(v.cur)){failAdd();return'Senha atual incorreta.'}
  await persistQ;const raw=new Uint8Array(await crypto.subtle.exportKey('raw',DEK)),{sec}=await wrapAll(v.u,v.p,raw,false,SECOBJ);sec.d=SECOBJ.d;SECOBJ=sec;SEC0=sec;localStorage.setItem(SECK,JSON.stringify(sec));try{localStorage.removeItem(FK)}catch(x){}toast('Senha alterada ✓');render()}finally{secBusy=false}})}
function newCodeForm(){form('Gerar novo código de recuperação',[{k:'cur',l:'Senha atual',t:'pw',ac:'current-password'}],async v=>{
 if(secBusy)return'Aguarde…';secBusy=true;try{if(failWait())return'Muitas tentativas. Aguarde '+failWait()+'s.';if(!await needPw(v.cur)){failAdd();return'Senha atual incorreta.'}
  await persistQ;const raw=new Uint8Array(await crypto.subtle.exportKey('raw',DEK)),code=newCode(),rs=rnd(16),r=await seal(await kdf(normCode(code),rs,150000),raw);
  setTimeout(()=>viewCode(code,async()=>{await persistQ;SECOBJ={...SECOBJ,ri:150000,rs:b64(rs),r};SEC0=SECOBJ;localStorage.setItem(SECK,JSON.stringify(SECOBJ));closeLk();toast('Novo código ativado — o anterior deixou de valer')},'Novo código de recuperação'),50)}finally{secBusy=false}})}
function offForm(){form('Remover proteção',[{k:'cur',l:'Senha atual',t:'pw',ac:'current-password'}],async v=>{
 if(secBusy)return'Aguarde…';secBusy=true;try{if(failWait())return'Muitas tentativas. Aguarde '+failWait()+'s.';if(!await needPw(v.cur)){failAdd();return'Senha atual incorreta.'}
  await persistQ;localStorage.setItem(KEY,JSON.stringify(S));localStorage.removeItem(SECK);SECMODE=false;DEK=null;SECOBJ=null;SEC0=null;toast('Proteção removida — dados voltaram a ficar sem senha');render()}finally{secBusy=false}})}
/* ===== BACKUP CRIPTOGRAFADO: arquivo .json cifrado com uma senha própria (AES-256-GCM, chave derivada por PBKDF2 de 600.000 voltas) ===== */
async function saveText(fn,txt){try{const dl=window.claude&&await window.claude.use('downloads');if(dl){await dl.save({filename:fn,data:txt});return true}
 const u=URL.createObjectURL(new Blob([txt],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download=fn;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);return true}catch(e){if(e&&e.code==='declined')return false;throw e}}
function expEncForm(){form('Exportar backup criptografado',[{k:'p',l:'Senha do backup (mínimo 8 caracteres)',t:'pw',ac:'new-password'},{k:'c',l:'Repita a senha do backup',t:'pw',ac:'new-password'}],async v=>{
 if(secBusy)return'Aguarde…';if(np(v.p).length<8)return'A senha precisa ter pelo menos 8 caracteres.';if(v.p!==v.c)return'As senhas não conferem.';
 secBusy=true;try{const salt=rnd(16),it=600000,sl=await seal(await kdf(np(v.p),salt,it),enc.encode(JSON.stringify(S)));
  const out=JSON.stringify({app:'wallstreet-backup',enc:true,v:1,at:todayStr(),it,s:b64(salt),iv:sl.iv,ct:sl.ct},null,1);
  if(await saveText('wallstreet-backup-criptografado-'+todayStr()+'.json',out))setTimeout(()=>{toast('Backup criptografado exportado');flagBkp()},60)}catch(e){return'Não foi possível exportar.'}finally{secBusy=false}})}
function importObj(o){if(!valid(o)||typeof o.owner!=='string')return toast('Arquivo inválido: não é um backup do WALL STREET');
 ask('Substituir os dados atuais pelo backup selecionado?',()=>{migrate(o);if(!o.pref||typeof o.pref!=='object')o.pref=S.pref;o.flags=(o.flags&&typeof o.flags==='object')?o.flags:{};o.flags.bkpAt=todayStr();S=o;open={};commit('Backup importado ✓')})}
function importEnc(o){if(!hasCrypto)return toast('Este navegador não consegue abrir backups criptografados (precisa de https).');
 if(!(Number.isInteger(o.it)&&o.it>=100000&&o.it<=2000000)||typeof o.s!=='string'||typeof o.iv!=='string'||typeof o.ct!=='string')return toast('Arquivo inválido: backup criptografado danificado');
 form('Backup criptografado',[{k:'p',l:'Senha do backup',t:'pw',ac:'current-password'}],async v=>{if(secBusy)return'Aguarde…';secBusy=true;let d;
  try{d=JSON.parse(dec.decode(await unseal(await kdf(np(v.p),ub64(o.s),o.it),{iv:o.iv,ct:o.ct})))}catch(e){return'Senha incorreta ou arquivo corrompido.'}finally{secBusy=false}
  setTimeout(()=>importObj(d),60)})}
/* ----- bloqueio automático ao ficar fora do app ----- */
document.addEventListener('visibilitychange',()=>{if(!SECMODE||!DEK)return;if(document.hidden)hid=Date.now();else if(hid&&S.pref.lk>=0&&Date.now()-hid>=S.pref.lk*60000)lockNow()});
/* ----- inicialização da segurança ----- */
if(SECMODE){document.body.classList.add('locked');if(!SEC0||!hasCrypto)lockUI('<div class="card"><h3>Dados protegidos</h3><p class="lbl">Não foi possível abrir: '+(hasCrypto?'o registro de segurança está ilegível.':'este endereço não permite criptografia (precisa de https).')+' Nada foi apagado.</p></div>');else viewLogin()}
else if(FIRST)viewWelcome();
else if(hasCrypto&&!localStorage.getItem('wallstreet.secskip'))viewSetup(false);


/* Ajustes → Aparência → Efeito de vidro */
document.addEventListener('change',e=>{if(e.target.id==='glSel'){S.pref.gl=+e.target.value;commit('Efeito de vidro atualizado')}else if(e.target.id==='anSel'){S.pref.av.an=+e.target.value;commit('Animações atualizadas')}});

if(!SECMODE){achCheck(true);save()}
render();loadNews();
if('serviceWorker' in navigator&&newsHosted())navigator.serviceWorker.register('sw.js').catch(()=>{}); /* instalável e funciona offline quando hospedado */
if(RM.addEventListener)RM.addEventListener('change',render);
</script>
